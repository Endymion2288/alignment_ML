[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "faser-tracklet-alignment"
version = "0.1.0"
description = "Reproducible FASER multi-station tracklet association and alignment studies"
requires-python = ">=3.9"
dependencies = [
  "awkward>=2",
  "matplotlib>=3",
  "numpy>=1.23",
  "PyYAML>=6",
  "uproot>=5",
]

[tool.setuptools.packages.find]
include = [
  "alignment*",
  "baselines*",
  "datasets*",
  "evaluation*",
  "geometry*",
  "models*",
  "scripts*",
  "training*",
]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
