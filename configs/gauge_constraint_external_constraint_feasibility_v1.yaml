# Workbook-77 Gauge-Constrained / External-Constraint Alignment Feasibility V1.
#
# Pre-registered BEFORE any gauge-fixed solve is run.  This campaign strictly
# separates two concepts:
#   A) software/reconstruction gauge constraint - chooses one definite
#      mathematical representative inside the tracker-unidentifiable
#      directions; it is NOT a physical measurement and gauge-fixed
#      parameters must never be reported as "measured to be 0";
#   B) external physical constraint - only a truly independent
#      survey/metrology measurement with validated frame mapping, known
#      measurement covariance, and identified IOV/mechanical-stability
#      provenance may be promoted to a physical constraint.
#
# Hard inheritance (all frozen, verified by SHA256 below):
#   - workbook 68: 7D tracker-only identifiable subspace; pooled rank 5,
#     null dimension 2; basis not portable; A = W^{1/2} J S with frozen S
#     and rank_tolerance=0.01; "V_null^T u_hat = 0 is the minimum-norm/gauge
#     representative in scaled coordinates, not a measurement".
#   - workbook 69: cross-source stable core dim 5; independent validation
#     failed (8/11 < 0.80).
#   - workbook 73: rigid-station-only 5DoF pooled rank 5 but not
#     source/coverage portable.
#   - workbook 76: physically-distinct K-short 5DoF complementarity failed
#     at physical closure (too_few_pairs only); no rank claimed; report-only
#     observables must not be reinterpreted as identifiability success.
#   - workbooks 61-67: existing survey/metrology evidence is NOT an
#     ingestable physical constraint (slots stay feasibility_only /
#     unavailable; population Sigma is not a measurement sigma; Kabsch /
#     dz-vs-x / conditions constants are forbidden as Stations ry priors).
#
# This campaign is constraint-space design / feasibility ONLY.  It must not
# solve real-data corrections, must not write geometry or official
# conditions, and must not use the workbook-76 K-short FD spectrum to design
# or tune any gauge criterion.

schema_version: faser-gauge-constraint-external-constraint-feasibility-v1
frozen: true
protocol_version: operating_protocol_v1
real_data_operating_mode: residual_dq_monitoring_only
geometry_write_allowed: false
official_conditions_write_allowed: false
real_data_candidate_alignment_authorized: false
survey_is_alignment_input: false
survey_is_external_cross_check_only: true

# --- hard prohibitions (all must be true) ---
do_not_retrain_v2: true
do_not_modify_frozen_v2_checkpoint: true
do_not_modify_pairwise_or_route_policy: true
do_not_run_full_parameter_newton: true
do_not_solve_alignment_correction_on_real_data: true
do_not_write_geometry_pool_or_cool: true
do_not_write_official_conditions: true
do_not_open_sealed_test: true
do_not_svd_naked_mixed_unit_jacobian: true
do_not_retune_scales_from_singular_values: true
do_not_retune_rank_threshold_from_spectrum: true
do_not_treat_null_zero_as_a_measurement: true
do_not_relabel_modes_as_mechanical_parameters: true
do_not_lower_min_pairs_post_hoc: true
do_not_use_kshort_wb76_spectrum_to_design_gauges: true
do_not_use_population_spread_as_measurement_sigma: true
do_not_use_conditions_constants_as_physical_prior: true
do_not_use_kabsch_or_dz_vs_x_tilt_as_station_ry: true
do_not_compare_gauge_dependent_absolute_parameters_across_gauges: true
do_not_use_full_truth_recovery_as_success_gate: true
do_not_reopen_7d_cluster_local_stable_core_or_rigid_5dof_rescue: true
do_not_add_more_tracker_data_to_chase_rank: true
solver_restricted_to_constrained_kkt_or_nullspace_projection: true
solver_restricted_to_identifiable_subspace: true
gauge_fixed_parameters_are_not_measurements: true
null_zero_is_minimum_norm_gauge_not_a_measurement: true

