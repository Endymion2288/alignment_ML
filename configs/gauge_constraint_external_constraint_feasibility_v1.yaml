# --- parameter space: frozen hierarchical V1 7D (workbook 44/68) ---
parameter_space:
  basis: hierarchical_v1
  parameter_names: [ift_dx_mm, ift_dy_mm, ift_dz_mm, ift_rx_mrad, ift_ry_mrad, ift_rz_mrad, C_dx]
  parameter_units: [mm, mm, mm, mrad, mrad, mrad, mm]
  scale_matrix_S:
    ift_dx_mm: 5.0
    ift_dy_mm: 5.0
    ift_dz_mm: 5.0
    ift_rx_mrad: 60.0
    ift_ry_mrad: 60.0
    ift_rz_mrad: 60.0
    C_dx: 0.12
  rank_tolerance: 0.01
  normal_matrix_rcond: 1.0e-10

# --- tracker information contract: rebuild the pooled 7D normal matrix from
# the frozen workbook-68 corpus and regress it against the frozen workbook-68
# identifiable_basis artifact (negative control).  No new reconstruction. ---
tracker_information:
  kind: physical_central_finite_difference
  iteration_manifest: outputs/mc24_ift_hierarchical_v1_iteration00_trainval_physical_v1/iteration_manifest.json
  anchor_point: iteration_00_reference
  min_truth_match_fraction: 0.99
  q_over_p_mode: 0
  splits: [train, validation]
  parameter_names: [ift_dx_mm, ift_dy_mm, ift_dz_mm, ift_rx_mrad, ift_ry_mrad, ift_rz_mrad, C_dx]
  source_ids:
    - mc24_100043_00200_00299
    - mc24_100043_00600_00699
    - mc24_100044_00300_00399
    - mc24_100047_00000_00049
    - mc24_100047_00150_00199
    - mc24_100048_00000_00049
    - mc24_100048_00150_00199
  regression_artifact: outputs/tracker_only_identifiable_subspace_three_arm_closure_v1/identifiable_basis.json
  regression_singular_value_rtol: 1.0e-6
  # Amendment 2026-09-05 (documented in workbook 77): the pre-registered
  # principal-angle gate (1e-6 deg) was set below the float64 resolution of
  # the arccos-based principal-angle metric itself - arccos(1 - eps) has a
  # quantization floor of sqrt(2*ulp(1)) ~ 2.1e-8 rad ~ 1.2e-6 deg, so the
  # metric cannot represent exact subspace agreement.  The first run failed
  # at 1.2074e-6 deg with bit-identical singular values, bit-identical
  # projectors (Frobenius distance exactly 0.0), and per-mode span residuals
  # ~1e-16.  The regression therefore uses the basis-independent projector
  # Frobenius distance (the frozen workbook 68-69 subspace_distance
  # convention), which has full float64 resolution; principal angles remain
  # as diagnostics only.
  regression_max_projector_frobenius: 1.0e-8
  expected_pooled_identifiable_rank: 5
  expected_pooled_null_dimension: 2

# --- candidate mathematical gauges (all linear G theta = 0 in the native
# 7-parameter order above).  Each must complement the frozen null space:
# rank(G)=2 and det(G . S . V_null) != 0.  Remaining degrees of freedom are
# 7 - 2 = 5 in every case. ---
gauge_candidates:
  - id: named_parameter_zero_gauge
    kind: fixed_reference_rigid_mode
    constraint_rows_native:
      - {parameter: ift_dz_mm, value: 0.0}
      - {parameter: C_dx, value: 0.0}
    remaining_dof: 5
    changes_tracker_observable_prediction: false
    calypso_convention_relation: >-
      Station-mode dz is already treated as a software gauge in the frozen
      contract (workbook 61-62: dz is not returned to tracks; dz=0+/-5 mm is
      a software gauge that does not constrain ry/C_dx).  C_dx =
      (dx_L0 - dx_L2)/2 is a gauge definition (workbook 61), not a
      measurement.  Fixing both at zero freezes the design/nominal
      representative.
    parameters_without_independent_interpretation: [ift_dz_mm, C_dx]
    interpretation_note: >-
      ift_dx_mm then means "dx given dz=0 and C_dx=0"; dz and C_dx are
      defined, not measured.  Never report them as measured-to-be-zero.
  - id: minimum_norm_scaled_gauge
    kind: minimum_norm_representative
    metric: severity_scaled
    constraint: V_null^T S^{-1} theta = 0
    remaining_dof: 5
    changes_tracker_observable_prediction: false
    calypso_convention_relation: >-
      No Calypso payload convention; this is the representative already
      named in the frozen workbook-68 assumption "V_null^T u_hat = 0 is the
      minimum-norm/gauge representative in scaled coordinates, not a
      measurement that null modes are physically zero".
    parameters_without_independent_interpretation: [ift_dz_mm, ift_dx_mm, C_dx]
    interpretation_note: >-
      All parameters with null-space content (dx, dz, C_dx mixture) carry
      gauge-dependent absolute components; only the identifiable projection
      is gauge-invariant.
  - id: minimum_norm_native_gauge
    kind: minimum_norm_representative
    metric: native
    constraint: (S V_null)^T theta = 0
    remaining_dof: 5
    changes_tracker_observable_prediction: false
    calypso_convention_relation: >-
      No Calypso payload convention; minimises the native-unit Euclidean
      norm of theta over the gauge orbit instead of the severity-scaled
      norm.
    parameters_without_independent_interpretation: [ift_dz_mm, ift_dx_mm, C_dx]
    interpretation_note: >-
      Same caveat as the scaled minimum-norm gauge; the two minimum-norm
      representatives differ whenever S is not proportional to the identity
      on the null block.

# --- pure-gauge closure (MC/control linear algebra only; no Athena, no new
# reconstruction, no real data).  Following the frozen
# solver_restricted_to_identifiable_subspace doctrine (workbook 68), the
# solve uses the identifiable restriction A_eff = A P_id of the frozen
# tracker information: the two near-null directions (singular values 28.16
# and 2.52, below the frozen rank_tolerance=0.01 cut) are excluded from the
# solve, so the gauge space is exactly null(A_eff) by construction and
# observable-equivalent representatives produce exactly identical
# measurements.  Measurement model: r_w = A_eff u + eps with
# eps ~ N(0, I) in the already W-weighted space. ---
closure:
  measurement_noise_sigma_weighted: 1.0
  identifiable_scaled_amplitude: 0.10
  null_scaled_amplitude: 0.10
  observable_equivalent_null_offset_scaled_amplitude: 0.10
  n_replicates: 8
  n_null_offsets_per_replicate: 4
  seed: 20260905
  held_out_pair_fraction: 0.5
  held_out_seed: 20260905
  gates:
    gauge_residual_max_abs: 1.0e-9
    representative_uniqueness_max_abs: 1.0e-8
    observable_prediction_max_relative_diff: 1.0e-8
    identifiable_projection_max_abs_diff: 1.0e-8
    held_out_prediction_max_relative_diff: 1.0e-8
    kkt_solve_residual_max_relative: 1.0e-8
    kkt_condition_max: 1.0e12
  full_truth_recovery_is_not_a_gate: true
  gauge_dependent_absolute_components_expected_to_differ: true

