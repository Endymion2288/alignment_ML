assumptions:
  - "A = W^{1/2} J S with frozen S and rank_tolerance=0.01; the tracker information is the rebuilt pooled workbook-68 normal matrix, regressed against the frozen workbook-68 artifact before any gauge use."
  - "Gauge constraints G theta = 0 select a mathematical representative inside tracker-unobservable directions; they are not physical measurements and gauge-fixed parameters are never 'measured to be 0'."
  - "Different legal gauges must give identical tracker-observable predictions; only gauge-invariant quantities (observable prediction, identifiable projection, relative transforms) may be compared across gauges."
  - "Stations ry software contract (workbook 67) is global left-multiply about the FASER origin; this campaign fills no survey prior and runs no Fisher/posterior ingest because no measurement covariance exists."
  - "The workbook-76 K-short FD spectrum is report-only and is never consulted to design or tune any gauge criterion."
  - "Closure uses synthetic measurements on the frozen tracker information; recovering the full injected theta truth is impossible by construction (gauge-equivalent truths are non-unique) and is not a success gate."

output_dir: outputs/gauge_constraint_external_constraint_feasibility_v1
