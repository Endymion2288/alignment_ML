  min_s3_kinematic_inside: 0.90
  min_occupancy_inside: 0.90
  max_hard_rate_transfer_minus_train: 0.10
  max_winner_rate_transfer_minus_train: 0.05
  max_median_delta_train_minus_transfer: 0.20
  max_median_logit_2to3_train_minus_transfer: 0.50

if_undercoverage:
