# Workbook 63: source-disjoint four-station training-diversity audit.
# Does not train, does not retune the workbook-62 objective / reduction /
# margin / operating point, and does not open sealed test.  The already
# opened workbook-56 transfer set is a development diagnostic only.
schema_version: faser-four-station-training-diversity-audit-v1
control_id: source_disjoint_training_diversity_audit_v1
workbook: 63
alignment_formulation: four_station_v1
relative_curriculum: 15d_gauge_then_left_se3
test_data_accessed: false
new_athena_production: false
condor_training_submitted: false
workbook56_transfer_is_final_gate: false
retune_loss_weight_reduction_or_operating_point: false
enlarge_misalignment_envelope: false
add_new_dof: false

scientific_hypothesis: >
  Workbook 62 already recovers absolute utility, reduces fragment winners,
  and pushes many train near-boundary routes, but a stable draw_01+common
  truth-utility drop remains on a new source.  The next question is whether
  the two current train sources cover the transfer phase space / source
  characteristics that cause that failure.  Only after that coverage
  decision may new source-disjoint training files be added.  The objective
  stays the frozen workbook-62 dustbin-aware + gauge + max-reduction whole.

