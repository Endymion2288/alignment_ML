# Workbook 85 pre-registration:
# GetState Covariance Transform Repair Validation V1.
#
# *** THIS IS NOT AN ALIGNMENT TASK. ***
# Workbook 84 froze `deterministic_segmentfit_get_state_transform_bug` with
# root cause `coordinate_convention_mismatch_and_jacobian_sign_error`.
# This campaign validates whether the TWO deterministic GetState repairs
# (Curvilinear slot mapping + d phi/d tx sign) are a SUFFICIENT cause of the
# WB83 source-covariance failure.  It re-runs the frozen WB83 Stage A on the
# SAME source-disjoint split with the SAME gates.  It does NOT enter Stage B,
# does NOT touch FaserActs, does NOT write geometry/conditions, and does NOT
# open Frozen-V2.
#
# Repair scope is EXHAUSTIVE and CLOSED:
#   1. loc1 = -global y, loc2 = +global x  (Athena Curvilinear for beam tracks)
#   2. d phi/d tx = -ty/r^2                 (correct atan2 Jacobian)
# Forbidden: scale factors, empirical rescaling, chi2 tuning, residual-based
# correction, station-dependent calibration, central-prediction changes.
#
# The whole campaign:
#   held_out_accessed = false
#   real_data_alignment_authorized = false
#   geometry_write_allowed = false
#   official_conditions_write_allowed = false
#   measurement_model_validated = false
# It reads NO real-data residual and never solves for an alignment correction.

