wb75_physical_pair_relative_bounded_primary:
  arm: 2
  arm_name: wb75_physical_pair_relative_bounded_primary
  description: >-
    Workbook-75 full six-source production-candidate training of the FROZEN
    Workbook-74 Physical Pair-Relative Route Encoder V1.  Architecture is
    identical to the Workbook-74 Primary: frozen V2 backbone + route head that
    consumes ONLY the 36-dim R_phys tensor (3x11 physical pair-relative edge
    observables + frozen Workbook-64 production edge logits L01/L12/L23),
    BOUNDED additive residual delta = B*tanh(raw_delta/B) with B=4.0.  It
    never reads s0..s3 / absolute node latent / absolute x/y/z/tx/ty route
    context.  Training contract (seed, optimizer, LR, weight decay, epochs,
    batching, curriculum, loss, loss weights, B, solver, OP, checkpoint
    selection) is inherited from Workbook 74 without retuning.  The only
    change versus Workbook 74 is the training corpus: the authorized six
    Workbook-64 sources, not a single-family source-transfer fold.
  workbook: 75
  input_contract:
    allowed_splits:
    - train
    forbidden_splits:
    - validation
    - test
    physical_geometry_repropagation: true
    q_over_p_mode: 0
    candidate_chi2_gate: null
    feature_set: residual_v1
    context_mode: full_event
    station_path:
    - 0
    - 1
    - 2
    - 3
    condition_axis: four_station_relative_l2
    curriculum_condition_magnitudes:
    - 0.0
    - 1.0
    development_validation_only_sources_forbidden: true
    authorized_train_sources:
    - mc24_100043_00200_00299
    - mc24_100044_00300_00399
    - mc24_100043_00300_00399
    - mc24_100044_00200_00299
    - mc24_100047_00100_00149
    - mc24_100048_00100_00149
    forbidden_sources:
    - mc24_100047_00350_00399
    - mc24_100048_00350_00399
    - mc24_100047_00800_00849
    - mc24_100048_00800_00849
  architecture:
    d_model: 128
    nhead: 8
    num_layers: 4
    ffn_dim: 256
    dropout: 0.1
    station_embedding_dim: 16
    station_pair_embedding_dim: 16
    direction_embedding_dim: 4
    use_geometric_bias: true
    use_chi2_physics_term: true
    chi2_lambda: 1.0
    chi2_tau: 2000000.0
    use_local_edge_residual: true
    route_hidden_dim: 128
    route_pair_embedding_dim: 16
    route_dropout: 0.1
    use_relative_route_representation: false
    route_representation_mode: physical_pair_relative
    use_additive_route_correction: true
    route_correction_bound: 4.0
  freeze_contract:
    freeze_backbone_and_edge_scorer: true
    frozen_components:
    - node_encoder
    - node_layers
    - edge_encoder
    - edge_score
    - local_edge_residual
    - route_edge_correction
    trainable_components:
    - route_encoder
    - route_score
    initialization:
      route_score_weight: zeros
      route_score_bias: zeros
  training:
    batch_size: 32
    learning_rate: 0.0002
    weight_decay: 0.0001
    seed: 20260822
    device: cuda
    early_stopping: false
    checkpoint_selection_split: train_only
    selection_policy: last_completed_epoch
    focal_gamma: 1.5
    hard_negative_weight: 2.0
    maximum_edge_positive_weight: 30.0
    maximum_route_positive_weight: 80.0
    edge_loss_weight: 1.0
    route_consistency_weight: 1.0
    one_to_one_competition_weight: 0.25
    fake_route_penalty_weight: 0.25
  curriculum_stages:
  - name: nominal
    maximum_condition_magnitude: 0.0
    epochs: 8
  - name: local_relative_and_gauge_control
    maximum_condition_magnitude: 1.0
    epochs: 22
  calibration:
    scope: station_pair
    method: platt
    bins: 15
    fit_split: identity_frozen_pre_training
    identity_map: true
  route_selection:
    method: adjacent_contiguous_unit_capacity_set_packing
    selection_split: pre_registered_frozen_historical_packing
    initial_thresholds:
      0->1: 0.001
      1->2: 0.001
      2->3: 0.001
    unmatched_penalty: -1.0
    composition: replace
    maximum_sweeps: 1
    maximum_hypotheses: 100000
  auxiliary_objective:
    keep_workbook56_packing_route_competition: true
    keep_workbook59_dustbin_aware_target: true
    enable_dustbin_aware_route_margin: true
    route_competition_reduction: max
    packing_margin: 1.0
    pair_threshold: 0.001
    unmatched_penalty: -1.0
    packing_route_competition_weight: 0.07061055340401011
    dustbin_aware_route_margin_weight: 0.05
    gauge_twin_consistency_weight: 1.0
