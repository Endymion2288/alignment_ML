# Survey-Summary Reconstruction & Frame-Reconciliation V1
# Transcribe recoverable 2021/2022 slide summaries into machine-readable
# evidence.  Do not wait for the original survey Excel, do not write PPT
# numbers as an alignment prior or geometry, and do not treat station
# standard deviations as Gaussian measurement sigma.

