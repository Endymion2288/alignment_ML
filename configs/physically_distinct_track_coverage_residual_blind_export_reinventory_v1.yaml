    sim_tag: s0013
    rec_tag: s0013-r0020
    geometry_tag: FASERNU-04
    geom_flag: TI12MC04
    conditions_tag: OFLCOND-FASER-04
    generator_provenance:
      generator: SingleParticle
      pid: 310
      mass_mev: 497.6
      theta: null
      phi: [0.0, 6.283185307179586]
      radius_mm: -100.0
      z_mm: [-2000.0, -1951.0]
      energy_sampler: TH2Sampler
      events_per_generator_job: 1000
      generator_jobs_per_rec_file: 10
    representative_log: /eos/experiment/faser/data0/sim/mc24/particle_gun/100130/log/s0013/FaserMC-MC24_PG_kshort_end_fasernu_xin-100130-00000.gen.log
    representative_rec_log: /eos/experiment/faser/data0/sim/mc24/particle_gun/100130/log/s0013-r0020/FaserMC-MC24_PG_kshort_end_fasernu_xin-100130-00000-00009-s0013-RDO.rec.log
    # Angular population, pre-registered before the full export from generator
    # metadata and the exporter-contract audit, not from coverage results:
    # the gun particle (pid=310, K0S) is neutral and leaves no SCT track; the
    # tracker-visible particles of the generated process are the charged
    # decay daughters (K0S -> pi+ pi-, |pdg|=211).  The workbook-74 reporter's
    # truth-match semantics (match fraction >= 0.99, truth_particle_id >= 0,
    # one representative tracklet at the preferred station) are unchanged;
    # only the particle id of the generated process differs, exactly as the
    # muon-gun populations use |pdg|=13.  The strict workbook-74 |pdg|=13
    # variant is still computed as a labelled cross-check (it is empty by
    # construction for a neutral gun; smoke: 0 muon-tagged tracklets in 500
    # events), never as the admission input.
    angular_population:
      abs_pdg: [211]
      min_truth_match_fraction: 0.99
      definition: truth_matched_charged_decay_daughter_tracklets
      preregistered_reason: "Neutral-kaon gun pid=310: gun particle leaves no tracker track; charged decay daughters (K0S -> pi+ pi-) are the tracker-visible generated process.  Exporter-contract audit: tracklet exporter, TrackTruthMatchingTool (majority barcode, no PDG filter), SegmentFit population, and MC event selection are all particle-generic; the only muon-specific element is the workbook-74 reporter angular mask |pdg|=13."
    crosscheck_angular_population:
      abs_pdg: [13]
      min_truth_match_fraction: 0.99
      definition: strict_workbook74_muon_mask_crosscheck_not_admission
    inputs:
      - {source_id: mc24_100130_00000_00009, path: /eos/experiment/faser/data0/sim/mc24/particle_gun/100130/rec/s0013-r0020/FaserMC-MC24_PG_kshort_end_fasernu_xin-100130-00000-00009-s0013-xAOD.root}
