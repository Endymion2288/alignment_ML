this_is_not_workbook_59_or_60_rank_rescue: true
residual_kind: true cluster-local unbiased residual
residual_decrease_label: DQ observable

# Stage-75 specific freezes.
do_not_inject_alignment_payload_in_export: true
do_not_construct_physical_fd_point_this_stage: true
do_not_compute_residual_based_selection_this_stage: true
