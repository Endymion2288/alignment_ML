      abs_pdg: [13]
      min_truth_match_fraction: 0.99
      definition: truth_matched_gun_particle_tracklets
      preregistered_reason: "Muon gun pid={-13,13}: identical to the workbook-74 truth-matched muon population."
    inputs:
      - {source_id: mc24_100120_00000_00009, path: /eos/experiment/faser/data0/sim/mc24/particle_gun/100120/rec/s0013-r0020/FaserMC-MC24_PG_muon_floor-100120-00000-00009-s0013-xAOD.root}
      - {source_id: mc24_100120_00010_00019, path: /eos/experiment/faser/data0/sim/mc24/particle_gun/100120/rec/s0013-r0020/FaserMC-MC24_PG_muon_floor-100120-00010-00019-s0013-xAOD.root}
