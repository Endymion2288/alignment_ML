sealed_test:
  productions: [100116, 100117]
  forbidden_source_ids:
    - mc24_100116_00030_00039
    - mc24_100117_00030_00039
  note: "Historical V1 sealed multidirection test. Never opened in this campaign."

# Nominal residual-blind export chain: persisted SegmentFit -> GhostBusters
# -> NtupleDumperAlg detailed tracklets -> canonical converter.  No alignment
# payload, no --refit-segments, no physical FD point, no residual selection.
export_chain:
  exporter: faser_ntuple_maker.py
  exporter_args: [--isMC, --useIFT, --export-tracklets]
  nevents: -1
  converter: scripts.convert_ntuple_tracklets
  converter_args: [--include-truth]
  content_audit: scripts.audit_tracklets
  schema_check: scripts.inspect_root_schema
  no_refit_segments: true
  no_tracker_align_sqlite: true
  no_export_tracklet_propagation: true
  one_job_per_xaod_file: true
  event_identity: physical_event_is_consecutive_run_event_block_in_file_order
  merged_rec_event_numbers_repeat_per_generator_job: true

condor:
  schedd_mode: eossubmit
  job_flavour: tomorrow
  request_memory_mb: 8000
  request_cpus: 1
  max_explicit_retries: 2

assumptions:
  - "Stage 75 executes only the workbook-74-authorized residual-blind HTCondor tracklet export of mc24_100120_muon_floor and mc24_100130_kshort_end_fasernu, then repeats the residual-blind coverage inventory.  It is not an FD campaign and not rank rescue."
  - "The export chain is the validated nominal chain: persisted SegmentFit, GhostBusters, NtupleDumperAlg detailed tracklets, canonical converter.  No alignment payload is injected; no physical FD point is constructed; no residual-based selection is applied."
  - "Merged MC24 rec files reuse generator-job event numbers (100120: 10 x 0..9999; 100130: 10 x 0..999 per file).  A physical event is a consecutive equal-(run_id, event_id) block in exporter file order; the inventory never sorts distinct physical events into one (run, event) group."
  - "One xAOD file is one source under the existing file-level production-slice schema.  The two candidates are never pooled, and no file is split into fake independent sources."
  - "The 100130 angular population is pre-registered as the truth-matched charged pion daughters of the neutral kaon gun; the strict workbook-74 |pdg|=13 variant is reported only as a labelled cross-check.  Neither is chosen from coverage results."
  - "Statistical gates are the frozen workbook-74 gates.  A candidate below gate is insufficient; gates are not lowered."
  - "A later native 5DoF FD campaign, if any candidate is admitted, requires its own pre-registered config and workbook entry and reuses the frozen rigid-station parameters, S=(5,5,60,60,60), rank_tolerance=0.01, and the same WLS definition.  Mixed pooled rank is not complementarity."
  - "Sealed 100116/100117 00030_00039 stays closed.  Unused 100043/100044/100047/100048 files are not a new population.  2024 r0022 collision-like data is not restacked."
  - "If neither candidate passes the frozen gates after the repeated inventory, this stage freezes current_track_coverage_insufficient_for_unconstrained_rigid_station_5dof; only then may a Gauge-Constrained / External-Constraint Alignment Feasibility branch be pre-registered."

output_dir: outputs/physically_distinct_track_coverage_residual_blind_export_reinventory_v1
