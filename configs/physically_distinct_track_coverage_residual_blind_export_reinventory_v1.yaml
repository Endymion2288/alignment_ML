# Physically-Distinct Track-Coverage Residual-Blind HTCondor Export &
# Reinventory V1 (workbook 75 / 2026-09-04).
#
# This campaign executes the single next step authorized by workbook 74:
# the residual-blind HTCondor tracklet export of the two metadata-distinct
# candidates mc24_100120_muon_floor and mc24_100130_kshort_end_fasernu,
# followed by a repeated residual-blind coverage inventory against the
# frozen workbook-74 gates and the canonical (tx, ty) envelope.
#
# It does not construct A = W^{1/2} J S, does not SVD, does not inspect
# rank, does not inject any alignment payload, does not build a physical
# FD point, and does not select events from residuals / Jacobian /
# singular values / cosine / alignment response.  Workbooks 59-74 remain
# frozen.  No coverage gate is modified.

schema_version: faser-physically-distinct-track-coverage-residual-blind-export-reinventory-v1
frozen: true
stage: residual_blind_htcondor_export_and_reinventory
protocol_version: operating_protocol_v1
real_data_operating_mode: residual_dq_monitoring_only
geometry_write_allowed: false
official_conditions_write_allowed: false
station_calibration_mode_available: false
cdx_mode_allowed: false
alignment_payload_from_self_nulling_residuals: false
geometry_candidate_from_identifiable_modes: false
survey_is_alignment_input: false
three_arm_authorized: false
frozen_v2_alignment_loop_authorized: false
real_data_correction_authorized: false
do_not_retrain_v2: true
do_not_modify_frozen_v2_checkpoint: true
do_not_modify_pairwise_or_route_policy: true
do_not_construct_station_calibration_mode: true
do_not_reopen_workbook_51_reduced_station_mode: true
do_not_reopen_workbook_36_as_this_campaign: true
do_not_enter_cdx_mode: true
do_not_run_full_parameter_newton: true
do_not_solve_alignment_correction_on_real_data: true
do_not_write_official_conditions: true
do_not_write_geometry_pool_or_cool: true
do_not_use_tracklet_intercept_as_cluster_residual: true
do_not_enter_full_module_identifiability_map: true
do_not_invent_new_cosine_cut: true
do_not_select_events_from_residual_or_cosine: true
do_not_restack_2024_r0022_collision_like: true
do_not_restack_canonical_5mrad_unused_files: true
do_not_open_sealed_test: true
do_not_svd_naked_mixed_unit_jacobian: true
do_not_retune_scales_from_singular_values: true
do_not_retune_rank_threshold_from_spectrum: true
do_not_treat_null_zero_as_a_measurement: true
do_not_relabel_modes_as_mechanical_parameters: true
do_not_rescue_seven_d_observable: true
do_not_rescue_cluster_local_observable: true
do_not_redefine_tracklet_stable_core_criterion: true
do_not_drop_entry_69_failure_sources: true
do_not_drop_failed_sources_to_recover_rank_five: true
do_not_delete_dz_or_cdx_columns_from_seven_d_svd: true
do_not_delete_rz_or_further_dof: true
do_not_force_write_old_survey_central_values: true
do_not_open_three_arm_unless_identifiability_passes: true
do_not_open_frozen_v2_alignment_loop: true
do_not_construct_fd_identifiability_this_stage: true
do_not_compute_svd_or_rank_this_stage: true
do_not_guess_branch_meaning_from_filename: true
do_not_lower_statistical_gates: true
do_not_mix_cross_year_residuals_or_alignment_constants: true
do_not_open_gauge_branch_until_inventory_closes: true
solver_restricted_to_identifiable_subspace: true
truth_selected_association_is_solver_control: true
survey_is_external_cross_check_only: true
residual_reduction_is_not_alignment_success: true
implied_cdx_is_not_a_measurement: true
cdx_fixed_is_not_a_measurement_of_zero: true
dz_is_not_a_tracker_free_parameter: true
