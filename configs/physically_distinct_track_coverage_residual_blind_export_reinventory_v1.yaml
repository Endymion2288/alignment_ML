# The only two candidates authorized by workbook 74 for residual-blind
# HTCondor tracklet export.  Input files are declared here before any export
# coverage number is known; the immutable input manifest builder records the
# measured EOS/xAOD metadata (size, adler32, event count, collection keys,
# generator/reconstruction provenance) for exactly these files.
#
# Source independence follows the existing schema: one reconstructed xAOD
# file is one source (a file-level production slice with disjoint generator
# segments and disjoint event content).  No file is split into fake
# independent sources; the two candidates are never pooled.
export_candidates:
  - id: mc24_100120_muon_floor
    metadata_class: mc_particle_gun_floor_origin
    declared_from: "Generator log Sim.Gun: pid={-13,13}, x=[-100,100] mm, y=-120 mm, z=[-2000,1000] mm, theta=None, energy=TH2Sampler. Origin is the floor/edge, not IP-like z=-3990 mm."
    expected_difference: floor_origin_topology_versus_ip_like_particle_gun
    physically_distinct_hypothesis: true
    same_production_as_canonical: false
    sealed: false
    production_dsid: 100120
    production_name: FaserMC-MC24_PG_muon_floor
    sim_tag: s0013
    rec_tag: s0013-r0020
    geometry_tag: FASERNU-04
    geom_flag: TI12MC04
    conditions_tag: OFLCOND-FASER-04
    generator_provenance:
      generator: SingleParticle
      pid: [-13, 13]
      mass_mev: 105.66
      theta: null
      phi: [0.0, 6.283185307179586]
      x_mm: [-100.0, 100.0]
      y_mm: -120.0
      z_mm: [-2000.0, 1000.0]
      energy_sampler: TH2Sampler
      events_per_generator_job: 10000
      generator_jobs_per_rec_file: 10
    representative_log: /eos/experiment/faser/data0/sim/mc24/particle_gun/100120/log/s0013/FaserMC-MC24_PG_muon_floor-100120-00000.gen.log
    representative_rec_log: /eos/experiment/faser/data0/sim/mc24/particle_gun/100120/log/s0013-r0020/FaserMC-MC24_PG_muon_floor-100120-00000-00009-s0013-RDO.rec.log
