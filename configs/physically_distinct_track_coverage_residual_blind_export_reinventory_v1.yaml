    declared_from: "Generator log Sim.Gun: pid=310, mass=497.6, z=[-2000,-1951] mm, energy=TH2Sampler. Neutral-kaon gun, not a muon IP-like beam."
    expected_difference: kshort_decay_origin_versus_muon_particle_gun
    physically_distinct_hypothesis: true
    same_production_as_canonical: false
    sealed: false
    production_dsid: 100130
