# Workbook-74 contract inheritance.  The loader verifies the SHA256 of the
# inherited config and that the gates / phase-space / rigid-station contract
# copied below are identical to the inherited values.
inherited_workbook_74_config: configs/physically_distinct_track_coverage_identifiability_feasibility_v1.yaml
inherited_workbook_74_config_sha256: 2a8b17a362fa38c4fb9ad16fdb379bf4c7f8046fb38f1bc1f345776e21936caf
inherited_workbook_74_canonical_coverage: outputs/physically_distinct_track_coverage_identifiability_feasibility_v1/canonical_coverage.json

# Frozen rigid-station 5DoF contract, inherited unchanged from workbook 74.
# This stage does not reconstruct A.  A later FD campaign, if a candidate is
# admitted and separately pre-registered, must reuse these values unchanged.
rigid_station_five_dof_contract:
  parameter_names: [ift_dx_mm, ift_dy_mm, ift_rx_mrad, ift_ry_mrad, ift_rz_mrad]
  parameter_units: [mm, mm, mrad, mrad, mrad]
  rank_tolerance: 0.01
  scale_matrix_S:
    ift_dx_mm: 5.0
    ift_dy_mm: 5.0
    ift_rx_mrad: 60.0
    ift_ry_mrad: 60.0
    ift_rz_mrad: 60.0
  weighted_matrix: "A = W^{1/2} J S"
  do_not_retune_this_stage: true
  do_not_reconstruct_this_stage: true

physics_scales:
  faser_ip_distance_mm: 480000.0
  tracker_radial_envelope_mm: 100.0
  ip_angular_acceptance_rad: 0.000208
  ip_like_max_slope: 0.0005
  stereo_rad: 0.020
  ift_layer_pitch_mm: 31.5
  strip_pitch_mm: 0.080
  wide_angle_min_slope: 0.002
  slope_definition: hypot_source_tracklet_tx_ty
  slope_source: canonical_tracklet_local_state
  slope_is_not_leftover_residual_rtx_rty: true
  slope_is_not_spectrometer_delta_x_over_delta_z: true
  station_z_mm:
    0: -1860.15
    1: 47.4
    2: 1237.4
    3: 2427.4
  station_z_match_tolerance_mm: 400.0

# Identical to workbook 74.
phase_space:
  coordinates: [tx, ty]
  preferred_station: 0
  envelope_quantiles: [0.01, 0.99]
  histogram_range_tx: [-0.40, 0.40]
  histogram_range_ty: [-0.40, 0.40]
  histogram_bins: 24
  azimuth_bins: 12
  min_truth_match_fraction: 0.99
  filename_5mrad_is_not_phase_space_proof: true

# Frozen before looking at any export coverage number.  Identical to
# workbook 74; do not lower.
coverage_gates:
  min_events: 200
  min_ift_events: 200
  min_complete_four_station_events: 80
  min_independent_sources_or_runs: 2
  require_ift_station_0: true
  require_stations_0_1_2_3_present: true
  min_outside_canonical_envelope_fraction: 0.20
  max_histogram_intersection_for_distinct: 0.80
  min_wide_local_slope_fraction: 0.30
  do_not_lower_gates: true
  collision_like_metadata_cannot_admit: true
  same_production_as_canonical_cannot_admit: true
  sealed_test_cannot_admit: true
  coverage_unmeasured_cannot_admit: true
  pooled_or_mixed_rank_is_not_admission: true
  min_xaod_files_for_export: 2
  min_xaod_events_per_file_for_export: 1000
  require_segmentfit_for_export: true
  require_ift_geometry_for_export: true

