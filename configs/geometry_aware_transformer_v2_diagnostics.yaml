# Post-test V1 mechanism diagnosis for the route-aware V2 study.
# This file intentionally has no base_config and no test path/reference.  The
# loader is allowed to open only validation assets from the physical curriculum
# manifest; the V1 test source remains permanently sealed.
geometry_aware_transformer_v2_diagnostics:
  input_contract:
    allowed_splits: [validation]
    forbidden_splits: [test]
    physical_geometry_repropagation: true
    q_over_p_mode: 0
    candidate_chi2_gate: null
    feature_set: residual_v1
    context_mode: full_event

  frozen_v1:
    ablation: geometry_aware_transformer
    require_validation_only_model_selection: true
    require_validation_only_calibration: true
    require_validation_only_operating_point: true

  execution:
    device: auto
    batch_size: 64
    calibration_bins: 15

  route_control:
    station_path: [0, 1, 2, 3]
    maximum_hypotheses: 100000
    capture_success:
      minimum_complete_track_efficiency: 0.70
      minimum_complete_track_purity: 0.95
      maximum_track_fake_rate: 0.05

  # Depth is the executed sparse-block count, i.e. the maximum message hop
  # count under a given message-edge policy.  Score edges and physical
  # candidates are unchanged for every probe.
  probes:
    - name: depth_0_local
      maximum_layers: 0
    - name: depth_1_full_messages
      maximum_layers: 1
    - name: depth_2_full_messages
      maximum_layers: 2
    - name: depth_3_full_messages
      maximum_layers: 3
    - name: depth_4_full_messages
      maximum_layers: 4
    - name: depth_4_adjacent_only
      maximum_layers: 4
      maximum_station_span: 1
    - name: depth_4_forward_only
      maximum_layers: 4
      allowed_directions: [0]
    - name: depth_4_backward_only
      maximum_layers: 4
      allowed_directions: [1]
    - name: depth_4_leave_station_0_out
      maximum_layers: 4
      excluded_stations: [0]
    - name: depth_4_leave_station_1_out
      maximum_layers: 4
      excluded_stations: [1]
    - name: depth_4_leave_station_2_out
      maximum_layers: 4
      excluded_stations: [2]
    - name: depth_4_leave_station_3_out
      maximum_layers: 4
      excluded_stations: [3]
