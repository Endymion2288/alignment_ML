# Expanded V3 physical corpus.  This file is intentionally standalone and
# contains no sealed test source path.  Every listed source must complete the
# real /Tracker/Align payload -> SCT cluster -> segment refit -> Acts export
# chain before it can enter a synthetic overlay or any model training.
physical_curriculum_mlp:
  allowed_splits: [train, validation]
  forbidden_splits: [test]

  # The 100043/100044 files provide balanced mu-/mu+ train sources.  The
  # 100047/100048 productions are source-file-disjoint validation sources.
  # ROOT metadata confirms the required persisted container names; admission
  # remains conditional on the recorded Calypso refit/export smoke below.
  source_selection:
    production_release: s0013-r0022
    metadata_audit_dir: outputs/mc24_v3_source_audit_v1
    required_persistence: [SCT_ClusterContainer, SegmentFit, Segments, TruthParticlesAux]
    admission_rule: complete_physical_refit_and_mode0_acts_export
    source_split_unit: original_xaod_file
    planned_refitted_events_per_source: 100

