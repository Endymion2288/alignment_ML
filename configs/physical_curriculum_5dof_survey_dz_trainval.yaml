# Source-disjoint train/validation declaration for the station-level
# 5-DoF (track-constrained) + 1 survey-constrained-DoF alignment framework.
# Sources and sealed-test exclusion are inherited from the V3 expanded
# corpus.  This file does not retrain any association model.
base_config: physical_curriculum_v3_expanded_trainval.yaml

physical_curriculum_mlp:
  allowed_splits: [train, validation]
  forbidden_splits: [test]

  alignment_hierarchy:
    active_level: station
    active_parameters: [ift_dx_mm, ift_dy_mm, ift_rx_mrad, ift_ry_mrad, ift_rz_mrad]
    survey_constrained_parameters:
      ift_dz_mm:
        prior_sigma: 5.0
        source: identifiability_pilot_severity_scale
        interpretation: survey_prior_not_track_measurement
    reserved_future_levels: [layer, module]
    reserved_station_components: [dx_mm, dy_mm, dz_mm, rx_mrad, ry_mrad, rz_mrad]
    activation_rule: identifiability_gate_and_linear_regime_joint_closure

  synthetic_multitrack:
    overlay_seed_scope: alignment_iteration_shared_across_payloads
