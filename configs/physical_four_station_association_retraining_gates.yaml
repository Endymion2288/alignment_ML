# Pre-registered association gates for the matched four-station V2 retraining
# pilot.  Written before production results.  15-DoF unknown-association WLS
# stays closed until these gates pass on source-disjoint validation.
alignment_formulation: four_station_v1
relative_curriculum: 15d_gauge_then_left_se3
q_over_p_mode: 0
route_solver: adjacent_contiguous_unit_capacity_set_packing
observation_statistics: physical_edge_deduplicated
test_data_accessed: false

historical_frozen_v2:
  root: /eos/home-x/xcheng/FASER/alignment_ML/outputs/mc24_v3_expanded_trainval_v2_bce_control_v1
  checkpoint: route_aware_transformer_v2.pt
  sha256: 0c85a001677678163512c59bd5ceb6d08bdefaab79c0f4628659a4a8ad766a27
  unmatched_penalty: -1.0
  pair_thresholds:
    0->1: 0.001
    1->2: 0.001
    2->3: 0.001

forbidden_operating_point_inputs:
  - outputs/mc24_four_station_identifiability_pilot_v1/frozen_v2_overlay
  - outputs/mc24_four_station_identifiability_pilot_v1/frozen_v2_overlay_synthetic_v1
