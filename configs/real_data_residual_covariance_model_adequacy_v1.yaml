# ---------------------------------------------------------------------------
# Population / split: inherited frozen from WB78. Calibration = 14973+14974
# ONLY. Held-out (14975/14976, 7 monitoring runs, 14977 report-only) remains
# completely closed; Workbook 79 never reads a held-out residual. No new run,
# no event removal, no route re-selection, no restacking.
# ---------------------------------------------------------------------------
population:
  inherit_from_workbook_78: true
  calibration_runs: [14973, 14974]
  held_out_closed: true

# ---------------------------------------------------------------------------
# H2 - covariance / statistical-model adequacy (PRIMARY line).
# ---------------------------------------------------------------------------
covariance_adequacy:
  # Whitening: z = L^{-1} (r - m_cell), where m_cell is the per-(run,
  # station-pair-type) coherent mean of the RAW residual (a diagnostic-only
  # alignment-bias proxy; never a new residual definition or alignment input).
  # If the frozen covariance describes the fluctuations around the coherent
  # mean, the whitened residual chi2 per degree of freedom is O(1).
  # Gate (pre-registered, generous to the model): chi2_resid/ndof <= 4.0.
  # ndof subtracts the estimated cell means (4 per non-empty run x pair cell).
  whitened_chi2_per_ndof_max: 4.0
  # Cross-run reproducibility of the empirical covariance structure, computed
  # per station-pair type on (0,1) and (0,2) (sufficient statistics); (0,3)
  # has <=1 pair per run and is report-only. The primary metric is the
  # basis-independent generalized-eigenvalue RMS log-deviation between the two
  # runs' empirical covariances (robust to near-degenerate spectra, unlike a
  # principal-eigenvector angle). Gate: RMS log-deviation <= ln(3) (factor-3,
  # ~3-4.5 sigma for n~70-115 per cell, d=4). The principal-eigenvector angle
  # and per-eigenvalue log-ratios are report-only context.
  cross_run_generalized_eigenvalue_max_rms_log: 1.0986122886681098  # ln(3)
  cross_run_principal_eigenvector_max_angle_deg: 30.0  # report-only context
  # Report-only (no gate): full eigenstructure, correlation matrices, chi2
  # concentration by covariance eigenmode, marginal pulls, condition numbers.
  min_pairs_for_empirical_covariance: 30

# ---------------------------------------------------------------------------
# Diagnostic-only covariance counterfactuals. NONE of these may enter the
# production solver, produce a deployable candidate, or be promoted to a new
# alignment model. They exist only to localize the cause of the large gamma.
# Every counterfactual artifact carries diagnostic_only=true and
# alignment_authorized=false.
# ---------------------------------------------------------------------------
covariance_counterfactuals:
  condition_cap: 1.0e3   # C: floor eigenvalues at lambda_max/condition_cap
  counterfactuals:
    - name: full_frozen          # A: official baseline (= WB78)
      kind: full
    - name: diagonal_marginal    # B: same marginal variances, off-diagonal = 0
      kind: diagonal
    - name: condition_capped     # C: eigenvalue floor at lambda_max/1e3
      kind: condition_capped
    - name: unit_weight          # D: equal weighting of all 4 observables
      kind: unit
  bootstrap_replicates: 50
  bootstrap_seed: 20260905

# ---------------------------------------------------------------------------
# H3 - observable / Jacobian-transfer support adequacy.
# ---------------------------------------------------------------------------
transfer_support:
  # (a) MC per-pair Jacobian dispersion within each station pair (frozen MC
  # property): relative Frobenius deviation of each per-pair J from the
  # station-pair mean J. Gate: RMS relative deviation <= 0.35 (consistent with
  # the WB78 injection-recovery gate scale, which the transfer already passed).
  mc_per_pair_jacobian_max_rms_relative: 0.35
  # (b) Real-vs-MC kinematic support overlap in the track-slope plane
  # (pred_tx, pred_ty) per station pair, residual-blind. A real pair is
  # "within support" if its robust Mahalanobis distance to the MC cloud is
  # within the chi2_2 99% contour (9.210). Gate: >= 90% of real pairs within
  # support for each of (0,1) and (0,2); (0,3) is report-only (2 pairs).
  mahalanobis2_99_2dof: 9.210
  min_fraction_within_support: 0.90
  kinematic_variables: [pred_tx, pred_ty]
  # No nearest-neighbour J substitution; support is an applicability
  # diagnostic only.

# ---------------------------------------------------------------------------
# Calibration cross-run transportability (report-only one-shot solves on
# 14973-only and 14974-only; NOT new corrections, still no held-out).
# Gates inherit the WB68/WB77 15-degree direction contract.
# ---------------------------------------------------------------------------
cross_run_transportability:
  direction_max_angle_deg: 15.0        # dominant informed eigenvector
  gamma_direction_max_angle_deg: 15.0  # gamma-hat direction between runs
  require_equal_rank: true

# ---------------------------------------------------------------------------
# Decision tree (pre-registered). Exactly one terminal string is frozen.
# Hard gates (WB78 baseline reproduction, finite data, bank/CSV bit-exact
# reproduction) failing -> real_data_model_adequacy_inconclusive.
# Otherwise count soft failures among {covariance_adequacy(H2),
# transfer_support(H3), cross_run_transportability}:
#   0 -> pass_nonlinear_preregistration_allowed
#   1 -> the specific failure string
#  >=2 -> real_data_statistical_model_multiple_failures
# ---------------------------------------------------------------------------
decision_tree:
  pass: real_data_model_adequacy_pass_nonlinear_response_preregistration_allowed
  inconclusive: real_data_model_adequacy_inconclusive
  multiple_failures: real_data_statistical_model_multiple_failures
  component_failures:
    covariance_adequacy: real_data_covariance_model_not_adequate
    transfer_support: real_data_jacobian_transfer_support_not_adequate
    cross_run_transportability: real_data_calibration_information_not_cross_run_stable

