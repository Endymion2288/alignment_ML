# Physically-Distinct Track-Coverage Identifiability Feasibility V1
#
# Stage 1 is a fully residual-blind coverage inventory.  It does not
# construct A = W^{1/2} J S, does not SVD, does not inspect rank, and
# does not reverse-pick samples from residual / cosine / Jacobian
# singular values.  Workbooks 59-73 remain frozen.  Rank-rescue of the
# 7D, cluster-local, stable-core, and rigid-station 5DoF observables
# is forbidden.

