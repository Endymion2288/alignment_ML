  enhanced_run_branch: run
  enhanced_event_branch: eventID
  enhanced_barcode_branch: truth_barcode
  truth_position_template: "truth_st{station}_{coord}"
  truth_momentum_template: "truth_st{station}_{mom}"
  straight_line_z_correction: true
  min_truth_match_fraction: 0.99
  physical_acceptance_abs_tx_ty_max: 0.2

closure_metrics:
  demean_per_pair: true
  whitening: symmetric_eigendecomposition
  metrics:
    - mean_z
    - marginal_rms
    - cov_z_eigenvalues
    - chi2_per_ndof
    - coverage_probability
    - lever_arm_dependence
    - tx_ty_dependence
  coverage_chi2_quantile_df: 4
  pencil_direction_analysis: true
  orientation_vs_scale: true

# Identical to the frozen WB81 Stage-2 gates.  Not tuned after execution.
closure_gates:
  whitened_chi2_per_ndof_max: 4.0
  cov_z_eigenvalue_min: 0.25
  cov_z_eigenvalue_max: 4.0
  generalized_eigenvalue_min: 0.25
  generalized_eigenvalue_max: 4.0
  pencil_variance_ratio_min: 0.25
  pencil_variance_ratio_max: 4.0
  min_pairs_per_pair: 20

modes:
  0:
    label: existing_production_covariance
    role: production_baseline
  1:
    label: validated_source_plus_existing_propagation
    role: part_a_plus_existing_qoverp_transport
  2:
    label: validated_source_plus_corrected_qoverp_treatment
    role: part_a_primary
  3:
    label: full_process_noise_model
    role: part_b

# Part A: C = J_geom C_src_WB86 J_geom^T.  J_geom is the field-free 4D
# lever-arm Jacobian; WB81 provenance says production has no process noise.
# Empirically J_geom C_exported J_geom^T matches ntuple mode-3 C_prop.
part_a:
  jacobian: geometric_lever_arm
  process_noise: false

# Part B: Highland MS, first-principles, NOT chi2-tuned.
# x/X0 is an order-of-magnitude SCT-station budget (3 layers x ~1.5% X0),
# not fitted.  p is the production tracklet |q/p| (dummy, available on data).
part_b:
  model: highland_multiple_scattering
  material_x_over_x0_per_gap: 0.05
  material_budget_source: order_of_magnitude_sct_station_not_chi2_tuned
  momentum_source: production_tracklet_q_over_p
  include_energy_loss_uncertainty: false
  include_material_effects_from_acts: false

qoverp_audit:
  report_with_and_without_dummy_qoverp: true
  do_not_delete_qoverp_column_as_final_scheme: true
  dummy_qoverp_is_not_a_physical_momentum_uncertainty: true

decision_tree:
  validated: faseracts_propagated_covariance_validated
  not_validated: faseracts_transport_covariance_not_validated
  mechanisms:
    - missing_process_noise
    - q_over_p_uncertainty_semantics
    - material_model_mismatch
    - transport_jacobian_error

