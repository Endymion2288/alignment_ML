# Workbook 87 pre-registration:
# FaserActs Propagated Covariance Validation V2.
#
# *** THIS IS NOT AN ALIGNMENT TASK. ***
# Workbook 86 froze `segmentfit_full_curvilinear_covariance_contract_validated`:
# the SegmentFit source covariance now closes under the full Athena
# CurvilinearUVT contract.  Source covariance is no longer the limiter.
# This campaign is the authorized Stage B: does
#
#   C_target = J_transport C_source_WB86 J_transport^T  +  process_noise
#
# describe the target residual
#
#   e_target = propagated fitted state - truth target state
#
# on the same source-disjoint MC as WB83/86?
#
# WB81 mode 3 is NOT inherited as the answer.  Every mode is recomputed on
# the WB86-repaired source covariance.
#
# Forbidden: real residual, geometry/conditions write, Frozen-V2, real-data
# calibration, truth q/p as a real-data solution, covariance tuning to chi2=1,
# deleting the q/p column as the final scheme, scale factors, outlier cuts.

