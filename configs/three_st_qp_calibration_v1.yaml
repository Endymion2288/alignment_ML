# Yasu line / Stage 2 — 3ST CKF q/p calibration.
# Official CKFTrackCollectionWithoutIFT native signed q/p is the only
# reconstructed momentum observable.  Truth is a calibration reference
# only: it must not enter the fit, seed, prior, prediction, or geometry
# solve.  Not alignment.  Not IFT residual weak-mode.  Not B14M/B15.
# Not Measurement Model V2.  Does not reopen WB87–WB118.  Does not
# start a new MC campaign.  Binning, gates, splits, and outlier rules
# are frozen here before any batch result is inspected.

