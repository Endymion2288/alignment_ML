# Pilot overlay configuration for the fixed-q/p-seed covariance-suppression
# (mode-3) diagnostic.  Every synthetic-multitrack parameter is identical to
# the frozen iteration-1 production overlay
# (configs/physical_curriculum_v3_expanded_trainval.yaml with
# overlay_seed_scope=alignment_iteration_shared_across_payloads); only the
# physical source pool is smaller (three pilot train sources), so the overlay
# events differ from production but are identical between the mode-0 and
# mode-3 candidate exports compared in this pilot.
physical_curriculum_mlp:
  synthetic_multitrack:
    source_pooling: within_split_same_payload
    scale_events_by_pool_sources: true
    events_per_payload: 120
    tracks_per_event: 3
    allow_duplicate_source_tracks: false
    stations: [0, 1, 2, 3]
    missing_tracklet_probability: 0.10
    fake_mean_per_station: 0.0
    random_easy_fake_mean_per_station: 0.25
    random_easy_min_chi2: 1000.0
    hard_negative_mean_per_target_station: 0.50
    hard_negative_chi2_min: 1.0
    hard_negative_chi2_max: 1000.0
    hard_negative_max_trials: 256
    minimum_truth_match_fraction: 0.99
    synthetic_run_id_base: 996000
    seed: 20260813
    overlay_seed_scope: alignment_iteration_shared_across_payloads

  field_candidate_export:
    q_over_p_mode: 0
    target_z_tolerance_mm: 1.0e-6
