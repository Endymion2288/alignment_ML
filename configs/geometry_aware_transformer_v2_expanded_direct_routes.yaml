# Validation-only direct-route residual control for the expanded V2 BCE run.
route_aware_transformer_v2_direct_routes:
  input_contract:
    allowed_splits: [validation]
    forbidden_splits: [test]
    physical_geometry_repropagation: true
    q_over_p_mode: 0
    candidate_chi2_gate: null
    feature_set: residual_v1
    context_mode: full_event
    station_path: [0, 1, 2, 3]
    curriculum_magnitudes_mm: [0.0, 0.1, 1.0, 5.0, 10.0, 50.0]

  route_query_calibration:
    method: platt
    bins: 15

  route_query_selection:
    complete_route_score_thresholds: [0.0]
    unmatched_penalties: [-1.0, -0.5, 0.0, 0.25, 0.5, 1.0]
    maximum_hypotheses: 100000
    complete_route_score_composition: residual
    complete_route_context_weights: [0.0, 0.025, 0.05, 0.10, 0.20, 0.40, 0.70, 1.0]
    selection_policy: nominal_primary_then_validation_capture_count_then_maximum_magnitude_then_mean_route_quality

  capture_success:
    minimum_complete_track_efficiency: 0.70
    minimum_complete_track_purity: 0.95
    maximum_track_fake_rate: 0.05
