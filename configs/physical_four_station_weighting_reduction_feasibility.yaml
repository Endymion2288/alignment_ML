# Workbook 61: train-only weighting / reduction feasibility.
# This is not a production operating-point contract and does not
# authorize training, a new checkpoint, threshold / penalty / Platt
# changes, architecture changes, or 15-DoF WLS.  Transfer is not
# loaded and cannot be used to pick a reduction or a loss weight.
schema_version: faser-four-station-weighting-reduction-feasibility-v1
control_id: weighting_reduction_feasibility_v1
workbook: 61
test_data_accessed: false
development_validation_used: false
new_athena_production: false
condor_training_submitted: false

scientific_hypothesis: >
  Workbook 60 showed the miner already selects every production winner.
  Remaining train/transfer mismatch is either missing short-fragment
  near-boundary cases on train, or per-event mean dilution of those
  cases.  The decision uses only train-overlay production margins.

frozen:
  candidate_checkpoint: outputs/mc24_four_station_dustbin_aware_route_v1/checkpoint
  candidate_checkpoint_sha256: 6565d028e01e561105d4ce467d10d5c82e5a2435daad6a69c47a07920defb5dc
  score_stream: raw_sigmoid_identity_calibration
  pair_thresholds:
    0->1: 0.001
    1->2: 0.001
    2->3: 0.001
  unmatched_penalty: -1.0
  dustbin_utility: 0.0
  packing_margin: 1.0
  complete_route_query_injected_into_packing: false
  unit_capacity_solver: adjacent_contiguous_unit_capacity_set_packing
  production_hypothesis_source: baselines.route_assignment._route_hypotheses
  observation_statistics: physical_edge_deduplicated
  candidate_builder: residual_v1_ungated_mode0
  train_overlay: outputs/mc24_four_station_relative_association_retrain_v1/overlay_synthetic_v1/synthetic_corpus_manifest.json
  allowed_splits: [train]
  forbidden_splits: [validation, test]
  train_sources:
    - mc24_100043_00200_00299
    - mc24_100044_00300_00399

margin_bins:
  convention: U_truth_minus_max_of_production_fragment_and_dustbin_zero
  hard: "delta <= 0"
  near_boundary: "0 < delta < packing_margin"
  easy: "delta >= packing_margin"

coverage_rule:
  short_competitor_lengths: [2, 3]
  short_sparse_route_fraction: 0.01
  reduction_if_opened: max_over_complete_truth_routes_in_event
  do_not_compare_reductions_on_transfer: true

do_not:
  train: true
  modify_checkpoint: true
  retune_threshold: true
  retune_unmatched_penalty: true
  refit_platt: true
  increase_dustbin_loss_weight: true
  change_packing_margin: true
  change_dustbin_aware_target: true
  open_15d_wls: true
  change_architecture: true
  change_production_contract: true
  submit_condor_training: true
  produce_athena: true
  load_transfer: true
  use_transfer_to_pick_loss_weights: true
  use_transfer_to_pick_reduction: true

next_if_short_boundary_absent_or_sparse: stop_curriculum_domain_coverage_limitation
next_if_short_boundary_never_event_max: stop_curriculum_domain_coverage_limitation
next_if_short_boundary_present_and_mean_dilutes: design_hard_aware_max_reduction_control
open_15d_wls_only_if:
  raw_complete_truth_chain_recall: true
  association_gate: true
  gauge_twin: true
  new_objective_control_on_source_disjoint_transfer: true
