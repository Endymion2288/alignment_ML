  B_loc2: "inject only loc2 uncertainty"
  C_phi: "inject only phi uncertainty"
  D_theta: "inject only theta uncertainty"
  E_qoverp: "inject q/p uncertainty"

# ---------------------------------------------------------------------------
# Decision tree: locate the WB83 mechanism.  The three-way success criterion
# is (1) SegmentFit covariance generation, (2) exporter transform, or
# (3) coordinate convention mismatch.  A loc1/loc2 <-> x/y permutation is
# NOT automatically an exporter bug: the exporter may be faithfully applying
# the Athena Curvilinear contract while SegmentFit mislabels the native basis.
# ---------------------------------------------------------------------------
decision_tree:
  exporter_owns_permutation:
    description: >-
      exporter Jacobian permutes loc1/loc2 vs labelled [x, y] incorrectly, or
      maps (phi, theta) to (tx, ty) incorrectly.
    action: freeze_as_deterministic_exporter_transform_bug
  segmentfit_owns_permutation_or_jacobian:
    description: >-
      SegmentFitAlg::GetState writes the global (x, y, tx, ty) covariance into
      the Curvilinear (loc1, loc2, phi, theta) slots under a wrong basis
      and/or a wrong analytic Jacobian.  The exporter transform is correct.
    action: freeze_as_deterministic_segmentfit_get_state_transform_bug
  no_deterministic_transform_bug:
    description: no deterministic permutation or Jacobian error found.
    action: trace_upstream_to_segment_fit_hit_error_model_covariance_construction

