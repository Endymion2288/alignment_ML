# Workbook 64: identical V2 architecture / residual_v1 / unit-capacity
# solver / identity Platt / 0.001 / -1.0 / margin 1 / dustbin-aware
# target / max reduction as workbook 62.  The only change is that
# training later loads the authorized six-source train overlay.
route_aware_transformer_v2:
  input_contract:
    allowed_splits: [train]
    forbidden_splits: [validation, test]
    physical_geometry_repropagation: true
    q_over_p_mode: 0
    candidate_chi2_gate: null
    feature_set: residual_v1
    context_mode: full_event
    station_path: [0, 1, 2, 3]
    condition_axis: four_station_relative_l2
    curriculum_condition_magnitudes: [0.0, 1.0]
    development_validation_only_sources_forbidden: true

  architecture:
    d_model: 128
    nhead: 8
    num_layers: 4
    ffn_dim: 256
    dropout: 0.10
    station_embedding_dim: 16
    station_pair_embedding_dim: 16
    direction_embedding_dim: 4
    use_geometric_bias: true
    use_chi2_physics_term: true
    chi2_lambda: 1.0
    chi2_tau: 2000000.0
    use_local_edge_residual: true
    route_hidden_dim: 128
    route_pair_embedding_dim: 16
    route_dropout: 0.10

  training:
    batch_size: 32
    learning_rate: 0.0002
    weight_decay: 0.0001
    seed: 20260822
    device: cuda
    early_stopping_patience: 30
    focal_gamma: 1.5
    hard_negative_weight: 2.0
    maximum_edge_positive_weight: 30.0
    maximum_route_positive_weight: 80.0
    edge_loss_weight: 1.0
    route_consistency_weight: 1.0
    one_to_one_competition_weight: 0.25
    fake_route_penalty_weight: 0.25
    packing_route_competition_margin: 1.0
    enable_dustbin_aware_route_margin: true
    packing_route_competition_reduction: max

  curriculum_stages:
    - name: nominal
      maximum_condition_magnitude: 0.0
      epochs: 8
    - name: local_relative_and_gauge_control
      maximum_condition_magnitude: 1.0
      epochs: 22

  calibration:
    scope: station_pair
    method: platt
    bins: 15
    fit_split: identity_frozen_pre_training
    identity_map: true

  route_selection:
    method: adjacent_contiguous_unit_capacity_set_packing
    selection_split: pre_registered_frozen_historical_packing
    initial_thresholds:
      0->1: 0.001
      1->2: 0.001
      2->3: 0.001
    unmatched_penalty: -1.0
    maximum_sweeps: 1
    maximum_hypotheses: 100000

  capture_success:
    minimum_complete_track_efficiency: 0.70
    minimum_complete_track_purity: 0.95
    maximum_track_fake_rate: 0.05
