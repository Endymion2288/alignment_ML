# Direct route-query validation study.  This config inherits no test source or
# test output.  The V2 checkpoint and its frozen edge calibration are supplied
# explicitly by the caller and must themselves certify validation-only use.
base_config: geometry_aware_transformer_v2.yaml

route_aware_transformer_v2_direct_routes:
  input_contract:
    allowed_splits: [validation]
    forbidden_splits: [test]
    physical_geometry_repropagation: true
    q_over_p_mode: 0
    candidate_chi2_gate: null
    feature_set: residual_v1
    context_mode: full_event
    station_path: [0, 1, 2, 3]
    curriculum_magnitudes_mm: [0.0, 0.1, 1.0, 5.0, 10.0, 50.0]

  route_query_calibration:
    method: platt
    bins: 15

  # Edge calibration and thresholds are not re-fit here: both come from the
  # selected V2 validation artifact.  This finite grid affects only the new
  # route-query output and the common dustbin utility, using all validation
  # events at every point.
  route_query_selection:
    complete_route_score_thresholds: [0.0001, 0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.10, 0.20, 0.30, 0.40, 0.50]
    unmatched_penalties: [-1.0, -0.5, 0.0, 0.25, 0.5, 1.0]
    maximum_hypotheses: 100000
    selection_policy: nominal_primary_then_validation_capture_count_then_maximum_magnitude_then_mean_route_quality

  capture_success:
    minimum_complete_track_efficiency: 0.70
    minimum_complete_track_purity: 0.95
    maximum_track_fake_rate: 0.05
