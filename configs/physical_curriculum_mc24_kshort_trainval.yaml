# Source-disjoint train/validation declaration for the workbook-76 K-short
# rigid-station 5DoF FD complementarity campaign.
#
# The ten mc24_100130 rec files are the file-level independent sources frozen
# by the workbook-75 residual-blind export manifest (SHA256
# d7048fadec1ce03b5eed9bf5388e42d2f1b67a0722835f2771807fe0cc384ab6).
# The train/validation assignment is pre-registered by file-name order before
# any FD reconstruction: 00000-00049 train, 00050-00099 validation.  It is
# never revised after inspecting any singular spectrum.
#
# Sealed test stays forbidden.  These merged-rec files reuse event numbers
# across generator jobs, so every consumer must use the workbook-76
# physical-event-identity contract (occurrence-augmented exact join in file
# order); sorted (run,event) grouping is forbidden for this population.
physical_curriculum_mlp:
  allowed_splits: [train, validation]
  forbidden_splits: [test]
  source_split_unit: original_xaod_file
  physical_event_identity: occurrence_augmented_file_order
