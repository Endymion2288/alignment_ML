# Expanded-corpus pairwise MLP control for V3.  The corpus path is supplied at
# runtime; this standalone configuration deliberately contains no historical
# or sealed-test source path.
physical_curriculum_mlp:
  allowed_splits: [train, validation]
  forbidden_splits: [test]

  refit:
    station_ids: [0, 1, 2, 3]
    reference_station: 0
    q_over_p_mode: 0

  payload_bank:
    magnitudes_mm: [0.0, 0.1, 1.0, 5.0, 10.0, 50.0]

  curriculum_mlp:
    model_topology: shared
    calibration_scope: station_pair
    feature_set: residual_v1
    # Keep the exact ungated mode-0 physical candidate graph for the route
    # comparison.  No residual-level or coordinate-level candidate surrogate
    # is admitted.
    candidate_chi2_gates: [null]
    candidate_gate_minimum_truth_recall: 0.98
    calibration_bins: 15
    target_inclusive_fake_rate: 0.05
    target_inclusive_purity: 0.95
    threshold_grid: [0.001, 0.005, 0.01, 0.02, 0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90]
    adaptive_threshold_quantiles: 31
    stages:
      - name: nominal_to_0p1mm
        maximum_magnitude_mm: 0.1
        epochs: 50
      - name: through_5mm
        maximum_magnitude_mm: 5.0
        epochs: 60
      - name: through_50mm
        maximum_magnitude_mm: 50.0
        epochs: 80
    hidden_dim: 64
    batch_size: 8192
    learning_rate: 0.001
    weight_decay: 0.0001
    seed: 20260813
    device: cuda

  global_assignment_mlp:
    # This wider diagnostic scan remains validation-only.  The route-level
    # comparison subsequently uses the same MLP checkpoint and ungated
    # station-pair calibration through evaluate_pairwise_mlp_route_validation.py.
    methods: [greedy, hungarian, dustbin_hungarian, sinkhorn_hungarian, multistation_flow]
    threshold_grid: [0.10, 0.20, 0.35, 0.50, 0.65, 0.80]
    adaptive_threshold_quantiles: 5
    unmatched_penalties: [-1.0, 0.0, 0.5, 1.0]
    sinkhorn_temperatures: [0.2, 0.5, 1.0]
    sinkhorn_iterations: 20
    multistation_flow_threshold_grid: [0.001, 0.01, 0.05, 0.10, 0.20, 0.35, 0.50, 0.65, 0.80]
    multistation_flow_adaptive_threshold_quantiles: 7
    multistation_flow_unmatched_penalties: [-1.0, -0.5, 0.0, 0.5, 1.0]
    multistation_flow_maximum_hypotheses: 100000
    validation_selection_scope: nominal_only
    target_inclusive_fake_rate: 0.05
    target_inclusive_purity: 0.95
    minimum_nominal_association_efficiency: 0.70
    scan_all_candidate_gates: false
