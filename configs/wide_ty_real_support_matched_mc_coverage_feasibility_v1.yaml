# ---------------------------------------------------------------------------
# Real support target (residual-blind).  Inherits the frozen WB80 calibration
# population (14973+14974) and reads ONLY residual-independent track/pair
# metadata.  The target domain is the (0,1)/(0,2) source-tracklet slope
# support; (0,3) has only 2 real pairs and stays report-only.  The WB80 gate
# (>= 0.90 per gated pair type) is inherited and NOT lowered.
# ---------------------------------------------------------------------------
real_support_target:
  calibration_runs: [14973, 14974]
  pair_types_gated: [[0, 1], [0, 2]]
  pair_types_report_only: [[0, 3]]
  # Primary kinematic: source-tracklet local slope (tx, ty) at station 0,
  # uniform across the real target and every candidate (incl. samples with no
  # propagations).  The propagation-frame (pred_tx, pred_ty) coverage is a
  # WB80-consistency cross-check for candidates that have propagations.
  primary_kinematic: [source_tx, source_ty]
  crosscheck_kinematic: [pred_tx, pred_ty]
  # Frozen WB80 reference failure (3-source construction subset, propagation
  # frame): recorded for context only; WB82 uses its own uniform method.
  wb80_reference_within_support:
    pair_0_1: 0.806
    pair_0_2: 0.872

