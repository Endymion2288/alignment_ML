# ---------------------------------------------------------------------------
# Coverage metrics + frozen gates (residual-blind).  The primary gate is the
# WB80-frozen 99% Mahalanobis-envelope support fraction >= 0.90 per gated pair
# type, PLUS a pre-registered density bin-occupancy gate (catches the
# "wide-but-sparse" failure mode where a smooth Gaussian envelope covers real
# points that have no actual MC density).  Both must pass.
# ---------------------------------------------------------------------------
coverage:
  mahalanobis2_99_2dof: 9.210          # chi2_2(0.99); WB80-frozen
  min_fraction_within_support: 0.90    # per gated pair type; NOT lowered
  min_truth_match_fraction: 0.99       # inherited from the WB80 FD-bank chain
  # Physical acceptance: tracklets with |tx| or |ty| beyond this are outside
  # the FASER tracker acceptance / mis-reconstructed (e.g. rare near-vertical
  # floor-muon tracklets) and are removed before the Mahalanobis fit so the
  # Gaussian envelope is not inflated by unphysical outliers.  The real support
  # (|tx|<=0.16, |ty|<=0.051) and all physical MC are far inside this bound.
  physical_acceptance_abs_tx_ty_max: 0.2
  # Density overlap (2D bin occupancy) at pre-registered widths; the primary
  # density gate uses primary_density_bin_width.
  density_bin_widths: [0.01, 0.02]
  primary_density_bin_width: 0.01
  min_density_bin_occupancy_fraction: 0.90
  # Pre-registered minimum MC statistics (NOT decided after seeing results).
  min_candidate_pairs_per_pair_type: 30   # inherit WB80 min_validation_pairs
  min_candidate_pairs_absolute: 10        # below this a Mahalanobis fit is meaningless
  min_independent_sources: 2              # feasibility of a source-disjoint split
  quantile_levels: [50, 90, 95, 99]

# ---------------------------------------------------------------------------
# Particle-species / momentum / origin audit (report-only).  A candidate that
# covers (tx,ty) angularly but is the wrong species/momentum for a muon
# conditional-J model is flagged
# `angular_support_only_particle_domain_mismatch`, NOT validated.
# ---------------------------------------------------------------------------
particle_domain_audit:
  expected_abs_pdg: [13]               # muon-like real calibration population
  momentum_gev_min: 10.0               # FASER muon-like tracks are high-p
  momentum_gev_max: 5000.0
  min_momentum_fraction_in_range: 0.50

# ---------------------------------------------------------------------------
# Decision tree (pre-registered, mutually exclusive).
# ---------------------------------------------------------------------------
decision_tree:
  validated: existing_mc_real_wide_ty_support_validated
  angular_only_particle_mismatch: existing_mc_angular_support_only_particle_domain_mismatch
  insufficient: existing_mc_insufficient_real_wide_ty_support
  inconclusive: wide_ty_mc_coverage_validation_inconclusive

# If every existing candidate fails, freeze
# `existing_mc_not_sufficient_for_real_wide_ty_transfer_support` and only THEN
# open a separate new-MC-generation-design campaign (not in this workbook).

