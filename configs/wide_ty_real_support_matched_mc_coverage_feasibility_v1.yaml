# Workbook 82 pre-registration:
# Wide-ty Real-Support-Matched MC Coverage Feasibility V1.
#
# *** THIS IS A RESIDUAL-BLIND MC-COVERAGE FEASIBILITY STUDY, NOT ALIGNMENT,
# *** AND NOT A COVARIANCE REPAIR (that is Workbook 83). ***
#
# Workbook 81 froze `faseracts_propagated_covariance_not_calibrated`
# (mechanism `overestimated_transported_fit_covariance`).  Workbook 80 froze
# `measurement_model_multiple_components_not_validated`; its Jacobian-transfer
# blocker was the REAL kinematic support: with the WB80 3-source MC
# construction subset the (0,1)/(0,2) `pred_tx/pred_ty` within-support
# fractions were 0.806 / 0.872 (< 0.90 gate), i.e. the real `ty` distribution
# is wider than the MC construction support.
#
# This campaign answers ONE residual-blind question:
#   Does any EXISTING non-sealed MC/control sample provide enough track
#   kinematic coverage to cover the real calibration population's (0,1)/(0,2)
#   (pred_tx, pred_ty) applicability domain, so that a FUTURE conditional-J
#   model could be trained/validated WITHOUT extrapolating to real tracks?
#
# It reads NO alignment residual, NO Jacobian/FD derivative, NO singular
# value/rank, NO final-correction performance.  Candidate admission uses ONLY
# physics metadata and kinematics.  The whole campaign:
#   held_out_accessed = false
#   real_data_alignment_authorized = false
#   geometry_write_allowed = false
#   official_conditions_write_allowed = false
#   external_constraint_ingest_authorized = false

