# Cluster-local observable cross-run identifiability and transfer validation V1.
# Workbook 68/69 remain frozen tracklet-level failures.  Workbook 70 restored
# exact join only.  Entry 58 remains cluster_local_identifiability_not_transferable
# until this campaign classifies that failure under unified exact-join wiring.
# First stage: r14973 reference and r14974 transfer only.  No three-arm, no
# Frozen-V2 alignment loop, no real-data correction.

schema_version: faser-cluster-local-observable-cross-run-identifiability-v1
frozen: true
protocol_version: operating_protocol_v1
real_data_operating_mode: residual_dq_monitoring_only
geometry_write_allowed: false
station_calibration_mode_available: false
cdx_mode_allowed: false
alignment_payload_from_self_nulling_residuals: false
survey_is_alignment_input: false
do_not_retrain_v2: true
do_not_modify_frozen_v2_checkpoint: true
do_not_modify_pairwise_or_route_policy: true
do_not_construct_station_calibration_mode: true
do_not_construct_reduced_station_mode: true
do_not_enter_cdx_mode: true
do_not_run_full_parameter_newton: true
do_not_solve_alignment_correction_on_real_data: true
do_not_write_official_conditions: true
do_not_write_geometry_pool_or_cool: true
do_not_use_tracklet_intercept_as_cluster_residual: true
do_not_enter_full_module_identifiability_map: true
do_not_invent_new_cosine_cut: true
do_not_select_events_from_residual_or_cosine: true
do_not_restack_2024_r0022_collision_like: true
do_not_open_sealed_test: true
do_not_svd_naked_mixed_unit_jacobian: true
do_not_retune_scales_from_singular_values: true
do_not_retune_rank_threshold_from_spectrum: true
do_not_treat_null_zero_as_a_measurement: true
do_not_relabel_modes_as_mechanical_parameters: true
do_not_rescue_tracklet_level_observable: true
do_not_redefine_tracklet_stable_core_criterion: true
do_not_drop_entry_69_failure_sources: true
do_not_fuzzy_match_join: true
do_not_nearest_neighbour_join: true
do_not_reselect_population_to_force_nonzero_join: true
do_not_add_dz_to_this_cluster_local_model: true
do_not_run_three_arm_this_stage: true
do_not_open_frozen_v2_alignment_loop: true
do_not_expand_beyond_r14973_r14974_this_stage: true
software_fd_sensitivity_only: true
survey_is_external_cross_check_only: true
residual_reduction_is_not_alignment_success: true
implied_cdx_is_not_a_measurement: true
retune_scales_from_singular_values: false
unknown_association_frozen_v2_closure_opened: false
entry_70_join_repair_is_not_identifiability_success: true
entry_58_decision_not_silently_overwritten: true
residual_kind: true cluster-local unbiased residual
residual_decrease_label: DQ observable

frozen_v2_checkpoint_sha256: 0c85a001677678163512c59bd5ceb6d08bdefaab79c0f4628659a4a8ad766a27
inherited_entry_58_decision: cluster_local_identifiability_not_transferable
inherited_entry_68_decision: tracker_only_identifiable_basis_unstable_solve_stopped
inherited_entry_69_decision: cross_source_stable_core_independent_validation_fail
inherited_entry_70_decision: cluster_local_transfer_exact_join_restored_not_an_identifiability_campaign

exact_join_key: run + event + TrackletHit_cluster_identifier = FaserSCT_Cluster.identify().get_compact()

# Official identifiable SVD.  Inherited, not retuned from this spectrum.
rank_tolerance: 0.01
normal_matrix_rcond: 1.0e-10

scale_matrix_S:
  station_dx_mm: 5.0
  station_ry_mrad: 60.0
  C_dx_mm: 0.12

parameter_names:
  - station_dx_mm
  - station_ry_mrad
  - C_dx_mm

parameter_units:
  - mm
  - mrad
  - mm

weighted_matrix: "A = W^{1/2} J S"
residual_weight: diagonal_inverse_cluster_local_u_variance
jacobian_native_ry_unit: mrad
sign_convention: largest_abs_right_vector_entry_positive

representative:
  station_id: 0
  layer_id: 0

finite_difference:
  translation_step_mm: 0.010
  rotation_step_mrad: 0.05
  c_dx_step_mm: 0.010
  translation_steps_mm: [0.010, 0.020]
  rotation_steps_mrad: [0.05, 0.10]
  c_dx_steps_mm: [0.010, 0.020]
  linearity_max_relative_deviation: 0.15
  targeting_max_offmodule_fraction: 1.0e-6
  l1_locality_max_fraction: 0.15

# Pre-registered before inspecting the official A-based transfer SVD.
jacobian_validity:
  min_measurements: 50
  min_routes: 8
  require_exact_join_complete: true
  require_finite_residuals: true
  require_finite_jacobian: true
  require_plus_minus_probes: true
  require_fd_smoke_pass: true
  min_column_norm_relative: 1.0e-6

gates:
  require_same_identifiable_rank: true
  max_principal_angle_deg: 15.0
  max_projector_frobenius: 1.0
  min_mode_persistence: 0.85
  max_weak_plane_principal_angle_deg: 15.0
  require_no_slope_tertile_rank_drop: true
  min_tertile_routes: 8
  n_slope_bins: 3

entry_58_reproduction:
  n_event_replicates: 400
  n_half_splits: 200
  seed: 14973
  min_routes: 8
  n_coverage_matched_draws: 100
  module_proxy_ry_cdx_abs_cosine: 0.994908703906658
  observed_reference_ry_cdx: 0.5312387420206447
  keep_as_negative_control_even_if_official_gates_differ: true

bootstrap:
  n_event_replicates: 40
  seed: 20260903
  min_routes: 8

runs:
  reference:
    run: 14973
    role: calibration_reference
    source_id: data24_r14973_00007_skip49500_n84988
    selected_routes: outputs/operating_protocol_v1_real_data_v2_route_acceptance_scaling_v1/association/data24_r14973_00007_skip49500_n84988/selected_routes.jsonl
    enhanced_tracklets: outputs/operating_protocol_v1_real_data_v2_route_acceptance_scaling_v1/sources/data24_r14973_00007_skip49500_n84988/physical_scan/points/iteration_00_current/refit/enhanced_tracklets.root
    physical_tracklets: outputs/operating_protocol_v1_real_data_v2_route_acceptance_scaling_v1/sources/data24_r14973_00007_skip49500_n84988/physical_scan/points/iteration_00_current/refit/tracklets.root
    input_xaod: /eos/experiment/faser/rec/2024/r0022/014973/Faser-Physics-014973-00007-r0022-xAOD.root
    cluster_dump: outputs/true_cluster_local_residual_feasibility_v1/cluster_local.root
    reconstruction: r0022
  transfer:
    run: 14974
    role: independent_calibration_transfer
    source_id: data24_r14974_00005_skip74400_n60886
    selected_routes: outputs/operating_protocol_v1_real_data_v2_route_acceptance_scaling_v1/association/data24_r14974_00005_skip74400_n60886/selected_routes.jsonl
    enhanced_tracklets: outputs/operating_protocol_v1_real_data_v2_route_acceptance_scaling_v1/sources/data24_r14974_00005_skip74400_n60886/physical_scan/points/iteration_00_current/refit/enhanced_tracklets.root
    physical_tracklets: outputs/operating_protocol_v1_real_data_v2_route_acceptance_scaling_v1/sources/data24_r14974_00005_skip74400_n60886/physical_scan/points/iteration_00_current/refit/tracklets.root
    input_xaod: /eos/experiment/faser/rec/2024/r0022/014974/Faser-Physics-014974-00005-r0022-xAOD.root
    cluster_dump: outputs/true_cluster_local_ry_cdx_stability_transfer_v1/dumps/cluster_local_r14974.root
    reconstruction: r0022

wrong_dump_control:
  description: workbook-68/70 negative control, r14974 routes joined against the r14973 feasibility dump
  transfer_routes_with_reference_dump: true

assumptions:
  - "Workbooks 68 and 69 remain frozen tracklet-level failures.  This campaign does not retune rank_tolerance, S, source set, topology, selection, route policy, or Frozen V2 to rescue tracklet-level observables."
  - "Workbook 70 restored exact join wiring.  That is not identifiability success and does not automatically overturn entry 58."
  - "Population is the frozen-V2 selected-route set of entries 57-58/70.  It is not reselected.  Join key remains run+event+cluster_identifier."
  - "Observable is r_u = u_cluster - u_track^unbiased on SiDetectorElement, leave-one-station-out using other-station cluster globals.  Tracklet intercepts at nominal layer z are not the residual."
  - "Parameter vector is the frozen entry-57/58 3-DoF (station_dx_mm, station_ry_mrad, C_dx_mm) on IFT.  dz is not added to this model.  dx-C_dx remains a possible combination."
  - "Official SVD is A = W^{1/2} J S with J in native mm/mrad and W = 1/var(u).  Entry 58 naked mixed-unit SVD is reproduced only as a negative-control classification, never as the official rank."
  - "Runs are the statistical unit.  Measurements are not pooled before rank or transferability."
  - "If a slope tertile with at least min_tertile_routes has identifiable rank below the full-sample rank, the extra dimension is coverage-conditioned and is not a portable subspace."
  - "First stage does not run three-arm, Frozen-V2 alignment, or real-data correction even if the four gates pass.  Expansion to more runs requires a new pre-registered config."
  - "Entry-69 rank 2/3/4 sources are not confirmatory samples for this cluster-local campaign."

output_dir: outputs/cluster_local_observable_cross_run_identifiability_v1
