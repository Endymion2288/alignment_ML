# Pre-registered workbook-56 objective / operating / transfer contract.
# Written before training and before transfer-validation results are opened.
# After those results are opened it is forbidden to change the objective,
# margin, loss weights, thresholds, unmatched penalty, or calibration.
schema_version: faser-four-station-gauge-consistent-route-training-v1
control_id: retrained_v2_gauge_consistent_route_v1
workbook: 56
alignment_formulation: four_station_v1
relative_curriculum: 15d_gauge_then_left_se3
q_over_p_mode: 0
route_solver: adjacent_contiguous_unit_capacity_set_packing
observation_statistics: physical_edge_deduplicated
test_data_accessed: false
architecture_change_allowed: false
v3_exact_structured_margin_allowed: false
candidate_builder_change_allowed: false
unit_capacity_solver_change_allowed: false
unmatched_penalty_rescue_allowed: false
second_platt_after_training_allowed: false
feature_set: residual_v1

scientific_hypothesis: >
  V2 edge ranking is usable, but the same ΔT_ij has absolute score-scale
  drift across a left-SE(3) common gauge, and the frozen packer lets
  truth-consistent 2/3-station fragments and mixed routes beat the complete
  four-station truth route.  Keep the historical V2 edge-BCE / route-query
  body and add two low-capacity auxiliaries.  Do not add Transformer depth,
  hidden size, or features.

operating_convention:
  frozen_before_training: true
  score_stream: raw_sigmoid_identity_calibration
  calibration:
    method: platt
    scope: station_pair
    fit_split: identity_frozen_pre_training
    identity_map: true
    slope: 1.0
    intercept: 0.0
    rationale: >
      Inference packing uses clipped log-odds of the scores it is given.
      Identity Platt makes those scores identical to sigmoid(raw logits), so
      training packing utilities and inference packing utilities share one
      convention.  A second post-hoc Platt is forbidden.
  pair_thresholds:
    0->1: 0.001
    1->2: 0.001
    2->3: 0.001
  unmatched_penalty: -1.0
  dustbin_utility: 0.0
  solver_probability_floor: 1.0e-6
  complete_route_query_injected_into_packing: false
  selection_split: pre_registered_frozen_historical_packing

objective:
  keep_historical_v2_body: true
  historical_v2_terms:
    edge_loss: weighted_focal_binary_cross_entropy
    route_truth_consistency: weighted_focal_binary_cross_entropy
    one_to_one_competition: endpoint_incident_route_logsumexp
    fake_route_penalty: softplus_on_fake_endpoint_routes
    edge_loss_weight: 1.0
    route_consistency_weight: 1.0
    one_to_one_competition_weight: 0.25
    fake_route_penalty_weight: 0.25
  auxiliaries:
    gauge_twin_consistency:
      pairing: alignment_iteration_shared_across_payloads_origin
      match: same_source_event_same_origin_edge_or_complete_route_same_delta_t_ij
      unpaired_fake_equality_required: false
      edge_term: mse_raw_adjacent_logits
      complete_route_term: mse_complete_route_packing_utility
    packing_route_competition:
      definition: local_adjacent_route_utility_margin
      solver_enumeration: same_as_production_contiguous_adjacent_routes
      truth: complete_four_station_truth_route
      competitor: strongest_solver_feasible_conflicting_hypothesis
      explicitly_included_competitors:
        - truth_consistent_3_station_suffix
        - truth_consistent_3_station_prefix
        - mixed_route
        - endpoint_conflict_route
      v3_global_loss_augmented_assignment: false
      margin: 1.0
      loss: relu_competitor_plus_margin_minus_truth_utility
      dustbin_if_no_feasible_competitor: 0.0
  loss_weight_algorithm:
    grid_search_on_validation: false
    development_validation_tuning_forbidden: true
    method: train_only_deterministic_mean_scale
    relative_target_vs_edge: 1.0
    epsilon: 1.0e-6
    weight_clip: [0.05, 20.0]
    freeze_after_initial_train_pass: true
    write_computed_weights_before_optimizer_steps: true

checkpoint_selection:
  split: train_only
  development_validation_used: false
  transfer_validation_used: false
  rule: last_completed_epoch_of_fixed_30_epoch_budget
  early_stopping: false
  epoch_budget: 30
  curriculum_stages:
    - name: nominal
      maximum_condition_magnitude: 0.0
      epochs: 8
    - name: local_relative_and_gauge_control
      maximum_condition_magnitude: 1.0
      epochs: 22

development_validation:
  development_validation_only: true
  sources:
    - mc24_100047_00050_00099
    - mc24_100048_00050_00099
  permitted_uses:
    - historical_mechanism_comparison
  forbidden_uses:
    - claim_production_association_gate
    - tune_loss_weight
    - tune_margin
    - retune_threshold
    - retune_unmatched_penalty
    - fit_calibration
    - select_checkpoint

train_bank:
  reuse_existing_physical_and_overlay: true
  new_athena_production: false
  root: outputs/mc24_four_station_relative_association_retrain_v1
  overlay: outputs/mc24_four_station_relative_association_retrain_v1/overlay_synthetic_v1
  sources:
    - mc24_100043_00200_00299
    - mc24_100044_00300_00399
  split_loaded: train

transfer_validation:
  carries_final_gate: true
  new_athena_production: true
  new_random_seed: 20260822
  relative_bounds:
    translation_mm: 0.50
    rotation_mrad: 5.0
  common_bounds:
    translation_mm: 0.30
    rotation_mrad: 3.0
  n_random_families: 2
  hard_relative_families: [hard_s3_ry]
  finite_difference_probes: false
  physics_expansion_allowed: false
  sources:
    - id: mc24_100047_00300_00349
      charge: mu-
    - id: mc24_100048_00300_00349
      charge: mu+
  after_results_opened_forbidden:
    - objective
    - margin
    - loss_weight
    - threshold
    - unmatched_penalty
    - calibration

gates:
  raw_complete_truth_chain_recall_min: 0.90
  adjacent_truth_edge_recall_min: 0.90
  nominal_complete_track_purity_min: 0.95
  nominal_track_fake_rate_max: 0.05
  complete_track_efficiency_drop_vs_nominal_max: 0.10
  complete_track_purity_drop_vs_nominal_max: 0.05
  track_fake_rate_increase_vs_nominal_max: 0.05
  require_adjacent_pair_and_s3_report: true
  gauge_invariance_audit:
    same_delta_t_ij_required: true
    complete_track_efficiency_twin_abs_diff_max: 0.05
    complete_track_purity_twin_abs_diff_max: 0.05
    track_fake_rate_twin_abs_diff_max: 0.05
    adjacent_23_efficiency_twin_abs_diff_max: 0.08
  score_scale:
    compare_against: workbook_54_retrained_v2_on_same_transfer_overlay
    matched_origin_raw_logit_median_abs_shift_ratio_max: 0.50
    matched_origin_truth_route_utility_median_abs_shift_ratio_max: 0.50
    require_strict_contraction: true

if_transfer_passes:
  freeze_checkpoint_calibration_operating_convention: true
  open_15d_route_selected_delta_t_ij_wls: true
  capture_contract: workbook_49_50_frozen
  retune_s0_s3_chart_rank_condition_or_delta_t_ij: false

if_association_fails_and_gauge_score_drift_gone:
  next: diagnose_packing_route_competition_objective
  architecture_change_allowed: false

if_gauge_twin_raw_logit_drift_remains:
  next: evidence_for_architecture_level_relative_geometry_representation
  do_not_increase_model_complexity_in_this_step: true

sealed_test: permanently_closed
device: cuda
cpu_fallback: false
