# ---------------------------------------------------------------------------
# Software provenance (read-only; pins the exact code whose covariance
# semantics are audited).  WB83 Stage A audits the SOURCE-tracklet covariance
# written by the exporter (NtupleDumperAlg.globalTrackletCovariance), which
# transforms the native Athena 5x5 (loc1,loc2,phi,theta,q/p) SegmentFit
# covariance to the global 4x4 [x,y,tx,ty] via a central numerical Jacobian.
# ---------------------------------------------------------------------------
software_provenance:
  calypso_root: /eos/home-x/xcheng/FASER/calypso
  calypso_git_sha: 40892527e9c65409afd2378a2abfc25ddbddac03
  athena_release: "24.0.41"
  acts_version: "32.0.2"
  exporter_source: PhysicsAnalysis/NtupleDumper/src/NtupleDumperAlg.cxx

# ---------------------------------------------------------------------------
# MC data (source-disjoint, file-level).  WB83 Stage A reuses the SAME
# hierarchical-V1 sources and the SAME construction/validation split as WB81
# (frozen there, inherited here), at the NOMINAL-geometry
# `iteration_00_reference` point so the tracklet fit and the Geant truth share
# one geometry.  The source tracklet state + fit covariance come from
# tracklets.root; the truth from enhanced_tracklets.root.
# ---------------------------------------------------------------------------
mc_data:
  source_root_template: >-
    outputs/mc24_ift_hierarchical_v1_iteration00_trainval_physical_v1/sources/{source_id}/physical_scan/points/iteration_00_reference/refit
  tracklets_file: tracklets.root
  tracklets_tree: tracklets
  enhanced_file: enhanced_tracklets.root
  enhanced_tree: nt
  construction_source_ids:
    - mc24_100043_00200_00299
    - mc24_100043_00300_00399
    - mc24_100043_00400_00499
    - mc24_100044_00200_00299
    - mc24_100044_00300_00399
  validation_source_ids:
    - mc24_100047_00000_00049
    - mc24_100047_00050_00099
    - mc24_100048_00000_00049
    - mc24_100048_00050_00099
  # Stage A tests the tracklet covariance at EVERY station (the source AND the
  # target tracklets share the same exporter transform; the alignment source is
  # station 0 but the miscalibration is station-universal).  Station 0 is the
  # primary alignment-source case.
  station_ids: [0, 1, 2, 3]
  primary_station_id: 0

# ---------------------------------------------------------------------------
# Truth / reference source state (Stage A truth-reference).  Identical
# construction to WB81 (per-station Geant truth, truth_stX_*), but evaluated at
# the SOURCE surface with NO propagation:
#   tx_truth = px/pz ; ty_truth = py/pz
#   x_truth(z_mm) = truth_stX_x + tx_truth * (z_mm - truth_stX_z)
#   y_truth(z_mm) = truth_stX_y + ty_truth * (z_mm - truth_stX_z)
#   e_source = [x_mm, y_mm, tx, ty]_fitted - [x_truth, y_truth, tx_truth, ty_truth]
# Only the tracklet's MEASURED state components [x, y, tx, ty] enter.  q/p is
# NOT a measured quantity of a straight tracklet, so the Stage-A primary
# observable does NOT require the dummy q/p to be "calibrated".
# ---------------------------------------------------------------------------
truth_reference:
  join_keys: [run_id, event_id, truth_particle_id]
  enhanced_run_branch: run
  enhanced_event_branch: eventID
  enhanced_barcode_branch: truth_barcode
  truth_position_template: "truth_st{station}_{coord}"   # coord in x,y,z
  truth_momentum_template: "truth_st{station}_{mom}"     # mom in px,py,pz
  straight_line_z_correction: true
  min_truth_match_fraction: 0.99
  # Physical acceptance guard (residual-blind): drop only unphysical
  # |tx|,|ty| outliers so they cannot inflate covariance envelopes.  Same value
  # as WB82.
  physical_acceptance_abs_tx_ty_max: 0.2
  min_tracklets_per_station: 30

# ---------------------------------------------------------------------------
# Stage A closure metrics.  For each station and each split
# (construction/validation), whiten  z = C_source^{-1/2} e_source  (symmetric
# eigendecomposition) and compute the pre-registered metrics.  The coherent
# mean of e_source is reported separately (a systematic, NOT what a covariance
# describes); the covariance gates use the de-meaned fluctuation.  No tracklet
# is dropped on pull/condition/fit quality.
# ---------------------------------------------------------------------------
source_closure_metrics:
  demean_per_station: true
  whitening: symmetric_eigendecomposition
  metrics:
    - mean_z
    - marginal_rms
    - cov_z_eigenvalues
    - chi2_per_ndof
    - coverage_probability
    - generalized_eigenvalues
    - marginal_variance_ratios
    - position_swap_diagnostic
    - correlation_orientation
    - tx_ty_dependence
    - qoverp_dependence
  coverage_chi2_quantile_df: 4
  # Position-swap diagnostic (report-only, NOT a gate): quantify whether the
  # written covariance's x<->y position block is exchanged relative to the
  # empirical e_source covariance.  Reports marginal variance ratios
  # (C_ii / emp_ii), the cross-swapped ratios (C_xx/emp_yy, C_yy/emp_xx), and
  # the chi2/ndof before vs after a position-only x<->y permutation.
  position_swap_diagnostic: true

# ---------------------------------------------------------------------------
# Pre-registered Stage A closure gates (confirmatory).  C_source is
# "calibrated" on a (station, split) cell only if ALL gates pass.  Gates are
# frozen before any confirmatory computation and are NOT tuned to make
# chi2 ~ 1.  Inherited from WB81's second-order-structure gate [0.25, 4].
# ---------------------------------------------------------------------------
source_closure_gates:
  whitened_chi2_per_ndof_max: 4.0
  cov_z_eigenvalue_min: 0.25
  cov_z_eigenvalue_max: 4.0
  generalized_eigenvalue_min: 0.25
  generalized_eigenvalue_max: 4.0
  min_tracklets_per_station: 30
  # Source-disjoint portability: the construction-derived conclusion must
  # reproduce on the validation split (both must agree on calibrated /
  # not-calibrated) for a portable verdict.

# ---------------------------------------------------------------------------
# Stage A repair models (pre-registered BEFORE any confirmatory closure).
# Only limited, physically interpretable source-covariance repairs are allowed,
# derived from SOURCE-LEVEL closure on the CONSTRUCTION split and confirmed on
# the VALIDATION split.  It is FORBIDDEN to reverse-optimize the source
# covariance from propagated-target whitening.  A permutation (x<->y swap
# reversal) is allowed ONLY as a pre-registered structural repair with an
# independently documented mechanism (exporter transform / SegmentFit basis),
# not as a whitening-tuned choice.
# ---------------------------------------------------------------------------
stage_a_repair:
  allowed_models:
    - global_scale
    - xy_block_scale
    - position_permutation_xy_swap
    - station_dependent_scale
  forbidden:
    - reverse_optimize_from_propagated_target_whitening
    - tune_to_best_chi2
  repair_derived_on: construction
  repair_confirmed_on: validation

# ---------------------------------------------------------------------------
# Stage B (propagation covariance construction) is GATED on Stage A success.
# It is pre-registered here for completeness but is NOT entered in this
# campaign unless Stage A yields a portable calibrated source covariance.
# Stage B would address: q/p covariance semantic repair (straight-tracklet q/p
# covariance not participating in geometric transport), and physically
# justified ACTS process noise (multiple scattering / energy loss) -- each a
# separate pre-registered contract, never "mode 3 + covariance inflation".
# ---------------------------------------------------------------------------
stage_b:
  entered_only_if_stage_a_validated: true
  qoverp_covariance_semantic_repair:
    description: >-
      straight-tracklet q/p covariance does not participate in geometric
      covariance transport (a covariance SEMANTICS change, NOT a truth-q/p
      substitution).  Must verify it does not wrongly delete real
      [x,y,tx,ty] covariance information.
    diagnostic_truth_qoverp_remains_diagnostic_only: true
  process_noise:
    description: >-
      multiple-scattering / energy-loss process noise may be added ONLY with
      physical justification (material map availability, particle hypothesis,
      ACTS MaterialInteractor semantics), never by whitening-tuning.
    requires_physical_preregistration: true

# ---------------------------------------------------------------------------
# Decision tree (pre-registered).  Exactly one terminal string is frozen.
# Only the final success state sets propagated_covariance_model_validated=true
# (and measurement_model_validated stays false until WB82/wide-ty J support is
# also independently true -- which WB82 has frozen true, but the two are
# combined only in a future Measurement Model V2).
# ---------------------------------------------------------------------------
decision_tree:
  # Stage A terminal states.
  source_tracklet_covariance_not_validated: source_tracklet_covariance_not_validated
  source_tracklet_fit_covariance_not_calibratable: source_tracklet_fit_covariance_not_calibratable
  # Stage B terminal states (not entered if Stage A fails).
  qop_covariance_semantic_repair_not_validated: qop_covariance_semantic_repair_not_validated
  process_noise_model_not_validated: process_noise_model_not_validated
  propagated_covariance_repair_not_validated: propagated_covariance_repair_not_validated
  propagated_covariance_repaired_and_source_disjoint_validated: propagated_covariance_repaired_and_source_disjoint_validated
  propagated_covariance_repair_inconclusive: propagated_covariance_repair_inconclusive

# ---------------------------------------------------------------------------
# Frozen prohibitions and terminal permissions (inherited + campaign-specific).
# ---------------------------------------------------------------------------
geometry_write_allowed: false
official_conditions_write_allowed: false
real_data_candidate_alignment_authorized: false
real_data_alignment_authorized: false
external_constraint_ingest_authorized: false
held_out_accessed: false
do_not_open_held_out: true
do_not_read_real_data_residuals: true
do_not_modify_faseracts_extrapolation_tool: true
do_not_select_events_by_residual: true
do_not_drop_pairs_by_condition_or_fit_quality: true
do_not_use_external_evidence_as_prior: true
do_not_solve_final_alignment: true
do_not_tune_covariance_to_chi2: true
do_not_promote_diagonal_or_capped_or_unit_covariance: true
do_not_extrapolate_beyond_canonical_support: true
do_not_open_alignment_diagnostic_v2: true
do_not_promote_diagnostic_variant_to_production: true
# WB83-specific: do NOT promote mode 3 to a production covariance; do NOT fill
# q/p with truth as a real-data solution; do NOT reverse-optimize the source
# covariance from propagated-target whitening; do NOT change the central
# propagated state as part of a covariance repair.
do_not_promote_mode3_to_production: true
do_not_use_truth_qoverp_for_real_data_solution: true
do_not_reverse_optimize_source_covariance_from_target: true
do_not_change_central_prediction_in_covariance_repair: true

