# Workbook 83 pre-registration:
# Propagated-Covariance Upstream Repair & MC Validation V1.
#
# *** THIS IS NOT AN ALIGNMENT TASK. ***
# Workbook 81 froze `faseracts_propagated_covariance_not_calibrated` with
# mechanism `overestimated_transported_fit_covariance`: the production C_prop
# is a deterministic J C J^T transport of the source-fit covariance with NO
# material/process noise, and the unconstrained dummy q/p covariance forms a
# dominant spurious pencil (over-estimated 310-3894x); mode 3 (suppress q/p
# covariance transport) removes the pencil but then UNDER-estimates the real
# propagation error 10-100x.  Workbook 81 identified TWO independent problems:
#   A. the dummy q/p covariance should not enter the propagated covariance;
#   B. the source-tracklet fit covariance itself does not cover the real
#      source-state / propagation stochastic error.
#
# Workbook 82 independently froze `existing_mc_real_wide_ty_support_validated`
# (the residual-blind wide-ty kinematic-support branch).  This campaign
# addresses ONLY the covariance branch; it changes no central prediction and
# solves no alignment.
#
# Workbook 83 splits the repair into two STRICTLY ORDERED levels:
#   Stage A: source-tracklet covariance truth closure (NO propagation).
#   Stage B: propagation covariance construction (only if Stage A passes).
# Stage A is validated FIRST and source-disjoint.  If Stage A cannot produce a
# portable calibrated source covariance, the campaign freezes
# `source_tracklet_fit_covariance_not_calibratable` and does NOT touch the
# FaserActs propagated covariance (propagation cannot repair a wrong input
# uncertainty model).
#
# The whole campaign:
#   held_out_accessed = false
#   real_data_alignment_authorized = false
#   geometry_write_allowed = false
#   official_conditions_write_allowed = false
#   external_constraint_ingest_authorized = false
# It reads NO real-data residual and never solves for an alignment correction.

schema_version: propagated-covariance-upstream-repair-mc-validation-v1
workbook: 83
created_utc: "2026-09-05T20:30:00+00:00"

