  seed: 20260905
  min_pairs: 20

# Cross-source stable-core protocol, frozen from workbook 69.  The
# hypothesis set is the eighteen canonical sources; the independent
# validation set is the ten K-short sources.  Consensus weighting is equal
# per source, so a high-track-count pion population cannot reweight the
# consensus by statistics.
stable_core:
  min_consensus_eigenvalue: 0.70
  min_mode_persistence: 0.85
  min_hypothesis_source_support_fraction: 0.80
  source_weighting: equal_per_source
  independent_min_source_support_fraction: 0.80
  independent_min_mode_persistence: 0.85
  independent_max_principal_angle_deg: 15.0
  independent_max_missing_frobenius: 0.75
  require_independent_same_core_dimension_as_hypothesis: true

gates:
  required_identifiable_rank: 5
  require_same_identifiable_rank: true
  pooled_rank_is_not_portability: true
  max_source_principal_angle_deg: 15.0
  max_source_projector_frobenius: 1.0
  max_train_validation_principal_angle_deg: 15.0
  max_train_validation_projector_frobenius: 1.0
  max_source_disjoint_principal_angle_deg: 15.0
  max_source_disjoint_projector_frobenius: 1.0
  max_topology_principal_angle_deg: 15.0
  max_topology_projector_frobenius: 1.0
  max_bootstrap_principal_angle_deg: 20.0
  max_bootstrap_projector_frobenius: 1.2
  require_no_slope_tertile_rank_drop: true
  require_jacobian_validity: true

# Pre-registered complementarity decision.  complementarity_pass is true
# only if EVERY condition below holds.  All numeric thresholds are inherited
# from the frozen workbook 68/69/73 contracts above; none is invented here.
complementarity_contract:
  # 1. Physical closure and provenance for the K-short FD bank: every
  #    pre-declared source x FD point complete, per-source Jacobian validity
  #    audit passes the frozen gates, exact-join duplicate physical-event
  #    identity count is zero, no geometry or official-conditions write.
  require_physical_closure: true
  # 2. Canonical-only regression: the rebuilt canonical analysis reproduces
  #    the workbook-73 frozen per-source ranks, pooled rank, and decision
  #    (singular values within singular_value_rtol).  This is a negative
  #    control on the analysis harness, not a retune.
  require_canonical_regression: true
  # 3. K-short information present: K-short-only pooled identifiable rank
  #    >= 1.  K-short-only is NOT required to reach rank 5.
  require_kshort_pooled_rank_at_least: 1
  # 4. K-short internal source stability at its native pooled rank: every
  #    K-short source reaches the K-short pooled rank and its identifiable
  #    subspace matches the K-short pooled subspace within the frozen
  #    source-stability gates (same rank, 15 deg, 1.0 Frobenius).
  require_kshort_source_stability_at_native_rank: true
  # 5. K-short coverage stability at its native pooled rank: no slope
  #    tertile rank drop, every usable tertile reaches the K-short pooled
  #    rank, and the complete-route topology slice reaches the K-short
  #    pooled rank with subspace within the frozen topology gates.
  require_kshort_coverage_stability_at_native_rank: true
  # 6. Joint pooled identifiable structure reaches the frozen rank
  #    criterion.  Necessary but never sufficient by itself.
  require_joint_pooled_rank: 5
  # 7. Joint subspace source stability: for every one of the 28 sources,
  #    the joint pooled subspace rebuilt WITHOUT that source matches the
  #    full joint pooled subspace (same rank 5, 15 deg, 1.0 Frobenius).
  #    This pooled-remainder LOSO is the well-defined joint stability
  #    question; the workbook-73 remaining-vs-left-out-source direction is
  #    still reported but is not the joint gate, because low-rank canonical
  #    sources stay in the pool by construction.
  require_joint_source_stability: true
  joint_source_stability_loso_mode: pooled_remainder
  # 8. Joint coverage stability on the pooled canonical+K-short bank:
  #    no slope-tertile rank drop, every usable tertile rank 5, complete
  #    four-station truth-route slice rank 5 with subspace within the
  #    frozen topology gates.
  require_joint_coverage_stability: true
  # 9. Joint event bootstrap and half-split stability pass the frozen
  #    gates (40 replicas, 12 half-splits, same rank, 20 deg, 1.2).
  require_joint_bootstrap_stability: true
  # 10. K-short independent validation of the canonical stable core
  #     (workbook-69 gate with roles pre-registered: hypothesis = eighteen
  #     canonical sources, independent = ten K-short sources): the
  #     canonical hypothesis core has dimension 5, and the K-short
  #     independent set passes the frozen support/persistence/angle/
  #     missing-frobenius thresholds.
  require_kshort_independent_validation_of_canonical_core: true
  require_canonical_hypothesis_core_dimension: 5
  # Reported but not gated (no frozen threshold exists; inventing one is
  # forbidden): canonical<->K-short pooled subspace principal angles, and
  # the K-short information content along the weakest canonical pooled
  # singular direction.
  report_only_metrics:
    - canonical_kshort_pooled_subspace_principal_angles
    - kshort_information_along_weakest_canonical_direction

assumptions:
  - "Physical Jacobian columns are central finite differences of truth-selected mode-0 pair residuals, reconstructed with only_parameters equal to the five station-free names; the K-short bank is produced by the same hierarchical V1 compiler and Calypso chain as the canonical bank."
  - "Native units remain mm for translations and mrad for rotations, matching /Tracker/Align payload conversion in physical_jacobian.COMPONENT_INDEX_AND_PAYLOAD_SCALE."
  - "Scale matrix S is the frozen station-free severity scale (5 mm / 60 mrad), declared before SVD and never retuned from singular values."
  - "Residual weight W is the nominal 4x4 pair covariance already used by solve_physical_finite_difference; it is a WLS weight, not an independent same-cluster covariance."
  - "Rank tolerance 1e-2 is the frozen leakage/Fisher relative cut applied to singular values of A = W^{1/2} J S."
  - "The workbook-75 |pdg|=211 mask defined only the residual-blind angular population for admission.  The FD observable is the workbook-73 truth-selected mode-0 pair residual with no PDG mask; truth matching is majority-barcode and particle-generic, audited applicable to K-short decay daughters."
  - "Merged-rec (run_id, event_id) is not a unique physical-event key for mc24_100130.  All cross-geometry joins use the occurrence-augmented physical-event identity in file order; sorted (run,event) grouping, fuzzy join, nearest-neighbour join, and residual-proximity join are forbidden.  Duplicate physical-event identity is a hard failure."
  - "The ten K-short sources stay file-level independent and are never merged; the pre-registered train/validation split follows file-name order and is never revised."
  - "The canonical bank is reused, not rerun; its manifest SHA256, parameter order, S, residual/W definition, rank tolerance, and units are verified at load time."
  - "Pooled rank=5 is not portability and joint pooled rank=5 alone is not complementarity success."
  - "K-short-only is not required to reach rank 5; its value is providing information directions that are stable across its own sources and coverage and that validate the canonical identifiable core independently."
  - "Equal-per-source consensus weighting prevents the high-statistics pion population from reweighting the stable core by track count."
  - "Survey/metrology remains an external cross-check only; real data remains residual_dq_monitoring_only; no geometry or official-conditions write is authorized."
  - "If complementarity fails, no rank-tolerance/S/residual/selection change, no source dropping, and no further nearby-MC trial is permitted; the only allowed continuation is a separately pre-registered Gauge-Constrained / External-Constraint Alignment Feasibility campaign."

