# Physically-Distinct K-short Rigid-Station 5DoF FD Complementarity
# Feasibility V1 (workbook 76).
#
# Pre-registered before any K-short FD reconstruction is submitted.  No
# criterion in this file may be revised after inspecting any K-short FD
# singular spectrum.
#
# Scientific question (the only one this campaign answers):
# does the physically-distinct angular/topological support of the K-short
# charged-pion daughter population provide stable, source-disjoint and
# coverage-disjoint NEW alignment information complementary to the canonical
# population, resolving the workbook-73 rigid-station 5DoF portability
# failure?  The question is NOT "is K-short alone rank 5" and NOT "is the
# pooled canonical+K-short rank 5".  Pooled rank 5 alone is never a success
# criterion here.
