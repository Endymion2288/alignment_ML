# Physical-event identity contract for the merged-rec K-short population.
# Workbook 75 proved (run_id, event_id) is not a unique physical-event key
# in these files: each rec file merges ten generator jobs that restart event
# numbering.  Every cross-geometry FD join must therefore use the
# occurrence-augmented identity: within one source file, the k-th
# consecutive (run_id, event_id) block in file order is physical occurrence
# k-1, and the synthetic unique key folds occurrence into the event id.
# All FD points of one source read the same xAOD through the same
# deterministic chain, so occurrence indices are identical across points and
# the join stays exact.  For files without collisions the augmented key
# equals the raw event id, so canonical behaviour is bit-identical.
physical_event_identity:
  contract: occurrence_augmented_file_order
  uid_stride: 1048576
  duplicate_physical_event_identity: hard_failure
  fuzzy_join_allowed: false
  nearest_neighbour_join_allowed: false
  residual_proximity_join_allowed: false
  sorted_run_event_grouping_allowed: false

