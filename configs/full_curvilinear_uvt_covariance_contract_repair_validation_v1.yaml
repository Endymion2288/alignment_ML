# Workbook 86 pre-registration:
# Full CurvilinearUVT Branch Covariance Contract Repair Validation V1.
#
# *** THIS IS NOT AN ALIGNMENT TASK. ***
# Workbook 85 froze `segmentfit_getstate_repair_insufficient` with remaining
# structure `mean_cyy_inflation_on_large_angle_subset`: the beam-track slot
# map loc1=-y, loc2=+x restores typical-tracklet closure (median chi2 ~ 0.83)
# but MEAN C_yy is inflated by |t.z|<0.99 tracks.  This campaign asks whether
# replacing that beam approximation with the FULL Athena CurvilinearUVT
# (both |t.z| branches) restores source-level covariance closure.
#
# Repair scope is CLOSED:
#   1. full CurvilinearUVT slot map from (curvU, curvV) for EVERY direction
#   2. d phi/d tx = -ty/r^2  (same sign correction as WB85)
# Forbidden: scale factors, chi2 tuning, outlier / angle-based rejection,
# residual-based correction, station-dependent calibration.
#
# Same WB83 Stage A split, gates, truth, residual-blind closure.
# Compares baseline vs WB85 beam repair vs WB86 full CurvilinearUVT repair.
# Reports |t.z|<0.99 and |t.z|>=0.99 subsets separately.

