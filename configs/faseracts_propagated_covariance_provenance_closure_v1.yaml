# Workbook 81 pre-registration:
# FaserActsExtrapolation Propagated-Covariance Provenance & Closure V1.
#
# *** THIS IS NOT AN ALIGNMENT DIAGNOSTIC V2. ***
# The earlier conditional "Workbook 81 = Gauge-Fixed Real-Data Alignment
# Diagnostic V2" branch was NOT triggered because Workbook 80 failed.  This
# campaign reuses the free number 81 for a ROOT-CAUSE upstream covariance
# validation, not an alignment solve.
#
# Workbook 80 froze `measurement_model_multiple_components_not_validated`:
#   covariance_model_validated = false
#   jacobian_transfer_model_validated = false
#   real_data_alignment_v2_preregistration_allowed = false
#   held_out_accessed = false
# WB80 proved (workbook 80 section 6.4) that the frozen combined covariance's
# near-singular pencil direction over-estimates the real residual variance by
# ~100-2000x, and that adding multiple-scattering process noise (C1) or a
# diagonal floor (C2) fixes chi2/ndof but leaves a near-zero Cov(z) eigenvalue.
# WB80 could NOT confirm the provenance of C_prop because the propagated
# covariance is produced by the EXTERNAL Calypso/ACTS FaserActsExtrapolationTool
# (`unresolved_external_provenance`).
#
# This campaign answers ONE upstream question:
#   What does the FaserActsExtrapolationTool propagated covariance C_prop
#   actually represent, and does its covariance transport / process noise
#   correctly describe the source-tracklet -> downstream-surface prediction
#   error on truth-known MC?
#
# This is upstream covariance validation, NOT alignment.  The whole campaign:
#   held_out_accessed = false
#   real_data_alignment_authorized = false
#   geometry_write_allowed = false
#   official_conditions_write_allowed = false
# It needs NO real-data residual solve and reads NO real-data residual at all.

schema_version: faseracts-propagated-covariance-provenance-closure-v1
workbook: 81
created_utc: "2026-09-05T13:40:00+00:00"

