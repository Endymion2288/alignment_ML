# ---------------------------------------------------------------------------
# Calibration / held-out split. Frozen residual-blind role inheritance from
# the WB48-52 blind corpus: calibration = 14973+14974, held-out =
# 14975+14976 (primary) + 7 expansion monitoring runs; 14977 report-only
# (statistics-insufficient). No new split is drawn; the split rule is the
# frozen operating-protocol role map. The split artifact (event/source IDs,
# counts, station coverage, SHA) is frozen before any candidate calculation.
# ---------------------------------------------------------------------------
split:
  rule: frozen_operating_protocol_role_map
  calibration_roles: [calibration]
  held_out_roles: [held_out, held_out_monitoring]
  report_only_roles: [held_out_report_only]
  min_anchor_pairs_for_run_gates: 30
  do_not_repick_split: true

# ---------------------------------------------------------------------------
# Observable-model transfer. Per-pair Jacobians on real data would require FD
# probes, which remain forbidden (do_not_generate_fd_probes). The only legal
# transfer is the frozen MC pooled-bank station-pair mean native Jacobian.
# Its model error is quantified by the MC control below, before real data.
# ---------------------------------------------------------------------------
transfer_model:
  kind: station_pair_mean_native_jacobian
  mc_corpus: workbook_68_pooled_bank
  mean_weighting: unweighted
  do_not_generate_fd_probes: true
  do_not_refit_real_data: true

# ---------------------------------------------------------------------------
# MC control (runs before any real calibration residual is read for a solve).
# Composition mirrors the frozen real calibration/held-out anchor-pair counts.
# Numerical gates are MC/control-derived and frozen here before held-out is
# opened, per the campaign rules.
# ---------------------------------------------------------------------------
mc_control:
  seed: 20260905
  calibration_composition: {"0->1": 227, "0->2": 156, "0->3": 2}
  # Full held-out evaluation population: primary held-out (14975, 14976) +
  # 7 expansion monitoring runs + report-only 14977.
  held_out_composition: {"0->1": 1005, "0->2": 655, "0->3": 15}
  scenarios:
    - name: mc_covariance
      covariance_scale: {x: 1.0, y: 1.0, tx: 1.0, ty: 1.0}
    - name: real_scale_covariance
      # Real/MC median covariance ratios from the frozen DQ CSV covariance
      # columns (covariance metadata only; no residual values used):
      # x rows ~300x, tx rows ~800x down-weighted on real data.
      covariance_scale: {x: 300.0, y: 1.0, tx: 800.0, ty: 1.0}
  injection_amplitude_scaled: 0.10
  # Pilot-derived (MC-only design feasibility, this session, frozen here):
  # informed-subspace injection recovery relative deviation <= 0.35;
  # uninformed-direction leakage into the informed subspace <= 0.35 x
  # amplitude.
  injection_recovery_max_relative: 0.35
  leakage_max_relative: 0.35
  null_ensemble_replicates: 200
  null_improvement_quantile: 0.95
  gauge_invariance_max_relative_diff: 1.0e-8

# ---------------------------------------------------------------------------
# Pre-fit applicability / linearity audit (calibration subset, report-first).
# ---------------------------------------------------------------------------
applicability:
  # Frozen linear envelope inherited from the WB33-35 / WB68 injection design:
  # scaled severity |gamma_k| <= 0.15 per informed mode. Exceeding it freezes
  # real_data_linearized_model_out_of_support; no correction is produced.
  max_scaled_mode_amplitude: 0.15
  hard_fail_on_nonfinite: true
  # The rebuilt bank must reproduce the frozen DQ adjacent-edge CSV rows
  # exactly; any mismatch is an implementation hard failure.
  csv_reproduction_max_abs_diff: 0.0

# ---------------------------------------------------------------------------
# Candidate solver (one-shot, no iteration, no unconstrained Newton).
# ---------------------------------------------------------------------------
solver:
  method: informed_subspace_wls_plus_gauge_null_space
  # Real calibration information rank in the frozen identifiable basis at the
  # frozen rank_tolerance. The solve is restricted to the informed subspace;
  # uninformed identifiable modes receive a zero update explicitly labelled
  # not_informed_by_real_data (never "measured zero"). If rank is zero the
  # campaign freezes real_data_identifiable_information_rank_zero.
  rank_tolerance: 0.01
  max_informed_condition: 1.0e12
  bootstrap_replicates: 50
  bootstrap_seed: 20260905
  # Gate E inheritance: WB68 source-stability principal-angle gate.
  bootstrap_max_direction_angle_deg: 15.0

# ---------------------------------------------------------------------------
# Held-out primary gates (evaluated only after the candidate is frozen).
# ---------------------------------------------------------------------------
held_out_gates:
  # A: held-out weighted residual norm must improve by more than the MC null
  # ensemble's 95th-percentile spurious improvement (computed in mc_control,
  # before calibration). delta_chi2 = chi2(candidate) - chi2(zero) must be
  # negative and |delta_chi2| > null floor.
  improvement_uses_null_floor: true
  # B: run-level consistency. Both primary held-out runs (14975, 14976) must
  # individually improve (delta_chi2 < 0). Leave-one-run-out over all
  # sufficient runs (>= split.min_anchor_pairs_for_run_gates anchor pairs):
  # the remaining held-out delta_chi2 must stay negative for every exclusion.
  primary_held_out_runs: [14975, 14976]
  # C: no station-pair x observable cell may worsen by more than the
  # chi-square fluctuation bound 2*sqrt(2*n_cell). Null control: adjacent
  # (1,2)/(2,3) frozen CSV edges have exactly zero predicted correction;
  # their chi2 change must be exactly zero.
  cell_worsening_bound: two_sigma_chi2_fluctuation
  # D: gauge invariance. The three legal gauges' held-out predicted
  # observable corrections must agree within the inherited WB77 tolerance.
  gauge_invariance_max_relative_diff: 1.0e-8
  # F: DQ slices. Post-correction isolation-channel (residual_y_mm,
  # residual_ty) run medians must not move away from zero relative to
  # pre-correction, and no sufficient run may newly cross the frozen entry-52
  # detector-condition alarm |robust_z| > 5 against the frozen 14973/14974
  # reference scale (median -3.80966 mm, robust scale 6.71221 mm for dy;
  # median -0.001780, scale 0.005244 for rx; n=390).
  frozen_reference_dy_median_mm: -3.80966
  frozen_reference_dy_robust_scale_mm: 6.71221
  frozen_reference_rx_median: -0.001780
  frozen_reference_rx_robust_scale: 0.005244
  robust_z_detector_condition: 5.0
  # G: correction amplitude within the frozen linear envelope (same gate as
  # applicability.max_scaled_mode_amplitude, applied to the frozen candidate).

# ---------------------------------------------------------------------------
# Decision tree (pre-registered). Exactly one terminal string is frozen.
# ---------------------------------------------------------------------------
decision_tree:
  pass: gauge_fixed_real_data_candidate_diagnostic_pass
  failures:
    tracker_information_regression_failed: tracker information SHA/regression mismatch with frozen WB68/77 basis
    real_data_population_provenance_mismatch: frozen population inventory does not match config expectations
    real_data_observable_model_transfer_failed: MC control injection/null/gauge-invariance gates fail
    real_data_diagnostic_inconclusive: non-finite/corrupt calibration data or bank/CSV reproduction mismatch
    real_data_identifiable_information_rank_zero: real calibration information has no informed identifiable direction
    real_data_linearized_model_out_of_support: candidate amplitude exceeds the frozen linear envelope
    real_data_gauge_fixed_candidate_not_source_stable: solver gates or bootstrap stability fail
    real_data_gauge_invariance_failed: legal gauges predict different held-out observables beyond tolerance
    real_data_heldout_observable_not_improved: held-out gates A/B/C/F fail

# ---------------------------------------------------------------------------
# Frozen prohibitions and terminal permissions.
# ---------------------------------------------------------------------------
geometry_write_allowed: false
official_conditions_write_allowed: false
real_data_candidate_alignment_authorized: false
external_constraint_ingest_authorized: false
eligible_external_physical_constraints: []
do_not_switch_primary_gauge_after_real_data: true
do_not_repick_split: true
do_not_select_events_by_residual: true
do_not_tune_on_held_out: true
do_not_generate_fd_probes: true
do_not_run_newton: true
do_not_write_payload: true
do_not_restack_2024_r0022_collision_like: true
do_not_use_external_evidence_as_prior: true
do_not_reopen_identifiability_rescue: true
do_not_redefine_identifiable_basis_on_real_data: true
output_parameter_naming: reconstruction_gauge_representative
forbidden_output_language:
  - measured station position
  - true station position
  - physical C_dx = 0

output_root: outputs/gauge_fixed_real_data_alignment_diagnostic_v1
