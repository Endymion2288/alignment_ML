# ---------------------------------------------------------------------------
real_data_population:
  contract: operating_protocol_v1_frozen_v2_selected_route
  observation_model: anchor_pairs_of_frozen_selected_routes
  observation_model_note: >-
    Pair residuals are recomputed from the frozen identity files
    (synthetic_tracklets.root + field_candidates.root) with the frozen
    evaluate_field_propagation chain (require_truth_match=False,
    q_over_p_mode=0). For every frozen selected route, anchor pairs
    (station 0 endpoint x station j endpoint, j>=1) are taken. This mirrors
    the frozen MC observable model (anchor IFT vs station j). Correctness
    regression: the rebuilt adjacent route edges must reproduce the frozen
    selected_route_field_edge_residuals.csv rows bit-exactly. No new
    reconstruction, no FD probes, no event selection.
  core_root: outputs/operating_protocol_v1_real_data_v2_route_acceptance_scaling_v1
  expansion_root: outputs/operating_protocol_v1_real_data_residual_dq_monitoring_expansion_v1
