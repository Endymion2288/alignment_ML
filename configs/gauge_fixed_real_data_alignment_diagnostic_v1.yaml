# ---------------------------------------------------------------------------
# Tracker information / parameter contract: identical to WB77 (frozen WB68).
# ---------------------------------------------------------------------------
tracker_information:
  # The jacobian_corpus block mirrors the frozen WB77 tracker_information
  # contract verbatim (same iteration manifest, anchor, truth-match fraction,
  # q/p mode, splits, parameter order, source IDs).
  jacobian_corpus:
    kind: physical_central_finite_difference
    iteration_manifest: outputs/mc24_ift_hierarchical_v1_iteration00_trainval_physical_v1/iteration_manifest.json
    anchor_point: iteration_00_reference
    min_truth_match_fraction: 0.99
    q_over_p_mode: 0
    splits: [train, validation]
    parameter_names: [ift_dx_mm, ift_dy_mm, ift_dz_mm, ift_rx_mrad, ift_ry_mrad, ift_rz_mrad, C_dx]
    parameter_scales: [5.0, 5.0, 5.0, 60.0, 60.0, 60.0, 0.12]
    source_ids:
      - mc24_100043_00200_00299
      - mc24_100043_00600_00699
      - mc24_100044_00300_00399
      - mc24_100047_00000_00049
      - mc24_100047_00150_00199
      - mc24_100048_00000_00049
      - mc24_100048_00150_00199
  rank_tolerance: 0.01
  rcond: 1.0e-10
  # The frozen WB68/77 identifiable/null basis is reused as-is. No re-SVD on
  # real data, no re-definition of V_id / V_null / P_id.

# ---------------------------------------------------------------------------
# Gauge contract. The primary gauge is frozen BEFORE seeing any real-data fit
# result. It is minimum_norm_scaled_gauge because it inherits the frozen
# WB68/77 severity-scaled minimum-norm representative and the
# solver_restricted_to_identifiable_subspace doctrine, NOT because it had the
# lowest condition number in WB77.
# ---------------------------------------------------------------------------
gauges:
  primary: minimum_norm_scaled_gauge
  secondary_control: named_parameter_zero_gauge
  report_only: minimum_norm_native_gauge
  candidates:
    - name: named_parameter_zero_gauge
      kind: fixed_reference_rigid_mode
      fixed_parameters: [ift_dz_mm, C_dx]
    - name: minimum_norm_scaled_gauge
      kind: minimum_norm_representative
      metric: severity_scaled
    - name: minimum_norm_native_gauge
      kind: minimum_norm_representative
      metric: native
  # Inherited WB77 numerical gates.
  gauge_residual_max_abs: 1.0e-9
  gauge_invariance_max_relative_diff: 1.0e-8
  kkt_condition_max: 1.0e12

# ---------------------------------------------------------------------------
