# Nominal-only physical pilot using independent MC24 2D-FLUKA muon xAOD
# chunks.  This is a baseline-repair gate: all entries are refitted from SCT
# clusters under a real payload before synthetic overlay; no coordinate-level
# augmentation or Transformer is involved.  Full 0.1--50 mm curriculum banks
# are intentionally deferred until this nominal primary point is established.
base_config: physical_global_assignment_muon.yaml

physical_curriculum_mlp:
  sources:
    - id: mc24_100116_00000_00009
      split: train
      input_xaod: /eos/experiment/faser/data0/sim/mc24/particle_gun/100116/rec/s0012-r0019/FaserMC-MC24_PG_mupl_fasernu_2D_fluka-100116-00000-00009-s0012-xAOD.root
