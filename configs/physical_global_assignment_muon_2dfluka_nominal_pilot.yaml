      input_xaod: /eos/experiment/faser/data0/sim/mc24/particle_gun/100116/rec/s0012-r0019/FaserMC-MC24_PG_mupl_fasernu_2D_fluka-100116-00010-00019-s0012-xAOD.root
    - id: mc24_100117_00010_00019
