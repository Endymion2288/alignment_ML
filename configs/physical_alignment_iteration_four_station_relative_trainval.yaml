# Overlay recipe for the four-station relative association curriculum.
# The synthetic policy is identical to frozen V2
# (configs/physical_alignment_iteration_trainval.yaml).  Do not retune
# events_per_payload, tracks_per_event, fake rates, or overlay_seed_scope.
base_config: physical_alignment_iteration_trainval.yaml

physical_curriculum_mlp:
  allowed_splits: [train, validation]
  forbidden_splits: [test]
  synthetic_multitrack:
    overlay_seed_scope: alignment_iteration_shared_across_payloads
